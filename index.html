<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraut und Rüben</title>
<meta name="description" content="Kraut und Rüben – dein Gartenplaner: geplant, gepflanzt, geerntet.">
<meta name="theme-color" content="#1f4d1a">
<!-- Vorschau beim Teilen des Links (WhatsApp, Signal, E-Mail …) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kraut und Rüben">
<meta property="og:title" content="Kraut und Rüben – dein Gartenplaner">
<meta property="og:description" content="Geplant, gepflanzt, geerntet: Garten zeichnen, Pflanzen setzen und ernten, Saison planen – mit Wetter- und Frostwarnungen.">
<meta property="og:url" content="https://dianakunz.github.io/kraut-und-rueben/">
<meta property="og:image" content="https://dianakunz.github.io/kraut-und-rueben/bilder/vorschau.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo von Kraut und Rüben: eine Rübe in der Erde">

<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="bilder/favicon.png">
<link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
<style>
/* ============================================================
   FARBEN & GRUNDLAGEN
   Die Farben stammen aus dem Logo: Blattgrün, Schriftgrün,
   Rübenrot, Erdbraun und ein heller Cremeton.
   ============================================================ */
:root{
  --bg:#f7f4ea; --karte:#fffdf7; --karte2:#f1ecdd; --linie:#e2dac6;
  --text:#25301f; --leise:#6b6f5e;
  --gruen:#3f8a2a; --gruen-dunkel:#1f4d1a; --gruen-hell:#e3efd3; --blatt:#8cc63f;
  --rot:#c8234a; --rot-hell:#fbe3e8; --erde:#5a3418; --erde-hell:#efe2d3;
  --blau:#2f6f9f; --blau-hell:#e1edf6; --gelb:#b7791f; --gelb-hell:#fbefd6;
  --schatten:0 1px 2px rgba(60,50,20,.06),0 4px 14px rgba(60,50,20,.06);
  --radius:14px;
  --marke:var(--gruen-dunkel);
  --t-vor:#e0a33a; --t-saat:#8cc63f; --t-pflanz:#3f8a2a; --t-ernte:#c8234a;
}
[data-theme="dark"]{
  --bg:#141812; --karte:#1d2219; --karte2:#252b20; --linie:#333b2c;
  --text:#e8eadf; --leise:#a3a895;
  --gruen:#7cc25a; --gruen-dunkel:#a6d98a; --gruen-hell:#26361f; --blatt:#8cc63f;
  --rot:#ef6a8b; --rot-hell:#3d1e26; --erde:#c9a07e; --erde-hell:#33281f;
  --blau:#7fb5df; --blau-hell:#1d2c38; --gelb:#e2b25c; --gelb-hell:#3a2f1a;
  --schatten:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --marke:#a6d98a;
  --t-vor:#e2b25c; --t-saat:#9bd25a; --t-pflanz:#5fae3e; --t-ernte:#ef6a8b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.5rem;color:var(--gruen-dunkel)}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0 0 .75em}
a{color:var(--gruen)}
button{font:inherit;color:inherit}
.verborgen{display:none!important}
svg.icon{width:24px;height:24px;flex:none}

/* ============================================================
   AUFBAU: Handy (Standard) und Laptop (ab 900 px Breite)
   ============================================================ */
#kopf{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bg); border-bottom:1px solid var(--linie);
}
.marke{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--marke);min-width:0}
.marke img{height:38px;width:auto}
.marke svg.wortmarke{height:34px;width:auto}
.version{font-size:.72rem;color:var(--leise);white-space:nowrap;align-self:flex-end;margin-bottom:2px}
.kopf-knoepfe{margin-left:auto;display:flex;gap:4px}
.rund{
  width:42px;height:42px;border-radius:50%;border:0;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--gruen-dunkel);
}
.rund:hover{background:var(--karte2)}
.rund.aktiv{background:var(--gruen-hell)}

#seitenleiste{display:none}

#leiste{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--karte);border-top:1px solid var(--linie);
  padding-bottom:env(safe-area-inset-bottom);
}
#leiste a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 0 6px;text-decoration:none;color:var(--leise);font-size:.7rem;
}
#leiste a.aktiv{color:var(--gruen-dunkel);font-weight:600}
#leiste a.aktiv svg{color:var(--gruen)}

main{padding:16px 14px calc(90px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.seitenkopf{display:none}

@media (min-width:900px){
  body{display:grid;grid-template-columns:250px 1fr;min-height:100vh;
    background:linear-gradient(to right,var(--karte) 249px,var(--linie) 249px,var(--linie) 250px,var(--bg) 250px)}
  #kopf,#leiste{display:none}
  #seitenleiste{
    display:flex;flex-direction:column;gap:4px;
    position:sticky;top:0;height:100vh;padding:20px 14px;
    background:transparent;
  }
  #seitenleiste .marke{flex-direction:column;align-items:flex-start;gap:6px;margin:0 8px 18px}
  #seitenleiste .marke .zeile{display:flex;align-items:center;gap:8px}
  #seitenleiste .marke img{height:58px}
  #seitenleiste .marke svg.wortmarke{height:48px}
  #seitenleiste nav a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    text-decoration:none;color:var(--text);font-weight:500;
  }
  #seitenleiste nav a:hover{background:var(--karte2)}
  #seitenleiste nav a.aktiv{background:var(--gruen-hell);color:var(--gruen-dunkel);font-weight:650}
  #seitenleiste nav a.aktiv svg{color:var(--gruen)}
  #seitenleiste .fuss{margin-top:auto;font-size:.75rem;color:var(--leise);padding:0 10px}
  .rechts{min-width:0}
  .seitenkopf{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;
    background:var(--bg);padding:16px 28px 12px;border-bottom:1px solid var(--linie);
  }
  .seitenkopf h1{margin:0}
  main{padding:24px 28px 48px}
  main > .seitentitel{display:none}
}

/* ============================================================
   BAUSTEINE
   ============================================================ */
.karte{
  background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);
  box-shadow:var(--schatten);padding:16px;margin-bottom:14px;
}
.karte > h2{display:flex;align-items:center;gap:8px}
.raster{display:grid;gap:14px}
@media (min-width:900px){ .raster.zwei{grid-template-columns:1.3fr 1fr;align-items:start} }
.leise{color:var(--leise)}
.klein{font-size:.85rem}
.knopf{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--linie);
  background:var(--karte);cursor:pointer;font-weight:550;text-decoration:none;color:var(--text);
}
.knopf:hover{background:var(--karte2)}
.knopf.haupt{background:var(--gruen-dunkel);border-color:var(--gruen-dunkel);color:#fff}
[data-theme="dark"] .knopf.haupt{background:#4f8f35;border-color:#4f8f35}
.knopf.haupt:hover{filter:brightness(1.1)}
.knopf.gefahr{color:var(--rot);border-color:var(--rot)}
.knopf.gefahr.voll{background:var(--rot);color:#fff}
.knopf.text{border-color:transparent;background:transparent;color:var(--gruen)}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],input[type=search]{
  width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--linie);
  background:var(--karte);color:var(--text);font:inherit;
}
input:focus,.knopf:focus-visible,.rund:focus-visible,a:focus-visible{outline:2px solid var(--gruen);outline-offset:2px}
.suchzeile{display:flex;gap:8px;max-width:560px}
.suchzeile input{flex:1}
.liste{list-style:none;margin:8px 0 0;padding:0}
.liste li button{
  width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--linie);
  background:transparent;cursor:pointer;
}
.liste li button:hover{background:var(--karte2)}
.umschalter{display:inline-flex;border:1px solid var(--linie);border-radius:10px;overflow:hidden}
.umschalter button{border:0;background:var(--karte);padding:9px 14px;cursor:pointer}
.umschalter button+button{border-left:1px solid var(--linie)}
.umschalter button.an{background:var(--gruen-hell);color:var(--gruen-dunkel);font-weight:650}
.hinweis{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin:8px 0 0}
.hinweis .sym{font-size:1.2rem;line-height:1.3}
.hinweis.frost{background:var(--blau-hell)}
.hinweis.warn{background:var(--gelb-hell)}
.hinweis.hitze{background:var(--rot-hell)}
.hinweis.ok{background:var(--gruen-hell)}
.hinweis b{display:block}
.marker{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--erde-hell);color:var(--erde);font-weight:600}

/* Wetter */
.wettertage{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.tag{text-align:center;padding:8px 2px;border-radius:10px;background:var(--karte2);font-size:.8rem}
.tag.heute{background:var(--gruen-hell)}
.tag .wt{font-weight:650}
.tag .sym{font-size:1.35rem;line-height:1.6}
.tag .max{font-weight:650}
.tag .min{color:var(--leise)}
.tag .min.frost{color:var(--blau);font-weight:650}
.tag .regen{color:var(--blau);font-size:.72rem;min-height:1.1em;white-space:nowrap}
.raster > div{display:grid;gap:14px;align-content:start}
.raster .karte{margin-bottom:0}
.raster{margin-bottom:14px}

/* Geplante Funktionen */
.bald{border-style:dashed;background:transparent;box-shadow:none}
.bald ul{margin:6px 0 0;padding-left:20px}
.bald li{margin:3px 0}

/* Dialog-Eingaben */
.felder label{display:block;margin:0 0 10px;font-weight:550}
.feld-einheit{display:flex;align-items:center;gap:8px;margin-top:4px}
.feld-einheit input{flex:1}
input[type=number],select{
  min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--linie);
  background:var(--karte);color:var(--text);font:inherit;width:100%;
}

/* ============ WISSEN / LEXIKON ============ */
.unternav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.unternav a{padding:8px 14px;border-radius:99px;border:1px solid var(--linie);background:var(--karte);text-decoration:none;color:var(--text);font-weight:550}
.unternav a.an{background:var(--gruen-hell);border-color:var(--gruen-hell);color:var(--gruen-dunkel)}
.lex-werkzeug{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.lex-werkzeug input[type=search]{flex:1 1 220px;width:auto}
.schalter-klein{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--leise);margin:4px 0 10px}
.legende span{display:inline-flex;align-items:center;gap:5px}
.legende i,.kal-gruppe-titel i{display:inline-block;width:12px;height:12px;border-radius:3px}
.lex-raster{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.lex-karte{display:block;background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--text);box-shadow:var(--schatten)}
.lex-karte:hover{border-color:var(--gruen)}
.lex-karte .kopf{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.p-badge{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:.85rem;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.p-badge.gross{width:52px;height:52px;font-size:1.2rem}
.jahr{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.jm{display:flex;flex-direction:column;gap:1px;min-height:18px;padding:1px;border-radius:3px;background:var(--karte2)}
.jm i{flex:1;border-radius:2px;min-height:3px}
.jm.jetzt{outline:1.5px solid var(--text);outline-offset:0}
.jahr.klein .jm{min-height:14px}
.zurueck{display:inline-block;margin:0 0 10px;text-decoration:none;font-weight:550}
.lex-kopf{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lex-kopf h2{margin:0}
.kal-tabelle{display:grid;grid-template-columns:auto repeat(12,1fr);gap:3px;align-items:center}
.kal-mon{text-align:center;font-size:.75rem;color:var(--leise)}
.kal-mon.jetzt{color:var(--text);font-weight:700}
.kal-name{font-size:.82rem;padding-right:6px;white-space:nowrap}
.kal-zelle{height:20px;border-radius:4px;background:var(--karte2)}
.kal-zelle.jetzt{outline:1.5px solid var(--text)}
.kal-text{margin-top:10px;display:grid;gap:2px}
.steckbrief{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 12px;font-size:.92rem}
.sb-l{color:var(--leise)}
.chip{display:inline-block;margin:0 6px 6px 0;padding:4px 10px;border-radius:99px;background:var(--karte2);border:1px solid var(--linie);color:var(--text);text-decoration:none;font-size:.88rem}
.chip:hover{border-color:var(--gruen)}
.chip.gut{background:var(--gruen-hell);border-color:transparent;color:var(--gruen-dunkel)}
.chip.schlecht{background:var(--rot-hell);border-color:transparent;color:var(--rot)}
.chip.umstritten{background:var(--gelb-hell);border-color:transparent;color:var(--gelb)}
.chip.mehr{font-weight:650}
.nb-gruppe{margin-bottom:6px}
.nb-titel{font-size:.82rem;font-weight:650;color:var(--leise);margin-bottom:4px}
.hinweis-karte{background:var(--gelb-hell);border-color:transparent}
.hinweis-karte ul{margin:0;padding-left:18px}
.hinweis-karte li{margin:4px 0}
ul.quellen{margin:0 0 10px;padding-left:18px}
ul.quellen li{margin:3px 0}
textarea{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--linie);background:var(--karte);color:var(--text);font:inherit;resize:vertical}
.monatswahl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.monatswahl h2{min-width:110px;text-align:center}
.kal-gruppe{margin:8px 0}
.kal-gruppe-titel{display:flex;align-items:center;gap:6px;font-weight:650;margin-bottom:6px}
.jahres-tabelle{display:grid;gap:3px}
.jt-kopf,.jt-zeile{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center}
.jt-kopf{font-size:.72rem;color:var(--leise);text-align:center;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:2;background:var(--karte);padding:4px 0}
@media (min-width:900px){.jt-kopf{top:62px}}
.jt-kopf span.jetzt{color:var(--text);font-weight:700}
.jt-zeile{text-decoration:none;color:var(--text);padding:2px 0;border-radius:6px}
.jt-zeile:hover{background:var(--karte2)}
.jt-name{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.jt-kopf,.jt-zeile{grid-template-columns:86px 1fr}.jt-kopf .jahr span{font-size:0}.jt-kopf .jahr span::first-letter{font-size:.72rem}}
.formular label{display:block;margin:0 0 10px;font-weight:550}
.zwei-spalten{display:grid;gap:0 14px}
@media (min-width:640px){.zwei-spalten{grid-template-columns:1fr 1fr}}
.monatsraster{display:grid;grid-template-columns:auto repeat(12,1fr);gap:3px;align-items:center;margin:4px 0 14px}
.mcheck{display:block;margin:0!important;cursor:pointer}
.mcheck input{position:absolute;opacity:0;pointer-events:none}
.mcheck span{display:block;height:26px;border-radius:5px;background:var(--karte2);border:1px solid var(--linie)}
.mcheck input:checked + span{background:var(--f);border-color:transparent}
.mcheck input:focus-visible + span{outline:2px solid var(--gruen)}

/* ============ GARTENPLAN ============ */
:root{
  --f-garten:#e6f1d3; --s-garten:#8cc63f;
  --f-rasen:#c9e4a0;  --s-rasen:#7fb13d;
  --f-weg:#e7dfd0;    --s-weg:#b3a58c;
  --f-terrasse:#ddd3c3; --s-terrasse:#9c8c72;
  --f-haus:#d8d0c4;   --s-haus:#7d6f5d;
  --f-sonstiges:#e3dbd0; --s-sonstiges:#8f8170;
  --f-beet:#b98a63;   --s-beet:#5a3418;
  --f-hochbeet:#94643d; --s-hochbeet:#4a2a12;
  --f-gewaechshaus:#d4eaf4; --s-gewaechshaus:#2f6f9f;
  --f-kuebel:#c27a45; --s-kuebel:#6b3a17;
  --plan-bg:#fbfaf4; --raster:#e4e0d2; --raster-stark:#d2ccb9; --auswahl:#c8234a;
  --beschriftung:#25301f;
}
[data-theme="dark"]{
  --f-garten:#26331d; --s-garten:#6fa33a;
  --f-rasen:#2f4721;  --s-rasen:#6fa33a;
  --f-weg:#3a352c;    --s-weg:#7d715d;
  --f-terrasse:#3b352d; --s-terrasse:#86775f;
  --f-haus:#3a3631;   --s-haus:#a4967f;
  --f-sonstiges:#36322c; --s-sonstiges:#998b76;
  --f-beet:#5b4129;   --s-beet:#c9a07e;
  --f-hochbeet:#4b3220; --s-hochbeet:#d2a57e;
  --f-gewaechshaus:#1f3a4a; --s-gewaechshaus:#7fb5df;
  --f-kuebel:#5e3a20; --s-kuebel:#e0a070;
  --plan-bg:#161b14; --raster:#232a1f; --raster-stark:#2f382a; --auswahl:#ef6a8b;
  --beschriftung:#e8eadf;
}
.plan-leiste{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.plan-leiste .knopf{min-height:38px;padding:6px 12px}
.plan-leiste .knopf.an{background:var(--gruen-hell);border-color:var(--gruen);color:var(--gruen-dunkel)}
@media (max-width:600px){
  .plan-leiste{gap:5px}
  .plan-leiste .lang{display:none}
  .plan-leiste .knopf{padding:6px 10px;min-width:40px}
  .plan-leiste .trenner{display:none}
  .plan-leiste select{max-width:130px}
  .menue-liste{position:fixed;left:12px;right:12px;top:auto;min-width:0}
}
.plan-leiste .trenner{width:1px;height:26px;background:var(--linie);margin:0 2px}
.plan-leiste select{width:auto;min-height:38px}
.knopf:disabled{opacity:.4;cursor:default}
.menue{position:relative}
.menue > summary{list-style:none}
.menue > summary::-webkit-details-marker{display:none}
.menue-liste{
  position:absolute;z-index:15;top:calc(100% + 4px);left:0;min-width:220px;
  background:var(--karte);border:1px solid var(--linie);border-radius:12px;box-shadow:var(--schatten);padding:6px;
}
.menue-liste button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.menue-liste button:hover{background:var(--karte2)}
.farbpunkt{width:16px;height:16px;border-radius:4px;border:2px solid;flex:none}
.farbpunkt.rund{border-radius:50%}
.farbpunkt.linie{height:9px;border-radius:6px}
.panel label.schalter{display:flex;align-items:center;gap:8px;color:var(--text);font-size:.9rem;margin-top:12px;cursor:pointer}
.panel label.schalter input{width:18px;height:18px;accent-color:var(--gruen)}
.garten-layout{display:grid;gap:14px}
@media (min-width:900px){
  .garten-layout{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .plan-spalte{position:sticky;top:84px}
  .garten-layout .panel{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin}
}
.plan-spalte{min-width:0}
.zeichnen-leiste{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  background:var(--rot-hell);border:1px solid var(--auswahl);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
.zeichnen-leiste .knopf{min-height:36px;padding:6px 12px}
.menue-liste .neu-modus{display:flex;margin:2px 2px 8px}
.menue-liste .neu-modus button{flex:1;justify-content:center;padding:7px 8px;border-radius:0;font-size:.85rem}
.menue-liste .neu-modus button.an{background:var(--gruen-hell);color:var(--gruen-dunkel);font-weight:650}
.menue-liste button:disabled{opacity:.4;cursor:default}
.plan-rahmen{
  position:relative;border:1px solid var(--linie);border-radius:var(--radius);overflow:hidden;
  background:var(--plan-bg);height:62vh;min-height:340px;
}
@media (min-width:900px){ .plan-rahmen{height:calc(100vh - 210px);min-height:460px} }
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#plan.ziehen{cursor:grabbing}
.massstab{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--leise);pointer-events:none}
.massstab div{height:6px;border:2px solid var(--leise);border-top:0;margin-bottom:2px}
.plan-hinweis{position:absolute;right:10px;bottom:8px;font-size:.75rem;color:var(--leise);pointer-events:none;text-align:right}
#plan .obj{stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:pointer}
#plan .obj.gewaehlt{stroke:var(--auswahl);stroke-width:2.5px}
#plan .art-haus{stroke-width:2px}
#plan .art-garten{fill:var(--f-garten);stroke:var(--s-garten)}
#plan .art-rasen{fill:var(--f-rasen);stroke:var(--s-rasen)}
#plan .art-weg{fill:var(--f-weg);stroke:var(--s-weg)}
#plan .art-terrasse{fill:var(--f-terrasse);stroke:var(--s-terrasse)}
#plan .art-haus{fill:var(--f-haus);stroke:var(--s-haus)}
#plan .art-sonstiges{fill:var(--f-sonstiges);stroke:var(--s-sonstiges)}
#plan .art-beet{fill:var(--f-beet);stroke:var(--s-beet)}
#plan .art-hochbeet{fill:var(--f-hochbeet);stroke:var(--s-hochbeet)}
#plan .art-gewaechshaus{fill:var(--f-gewaechshaus);stroke:var(--s-gewaechshaus)}
#plan .art-kuebel{fill:var(--f-kuebel);stroke:var(--s-kuebel)}
#plan .pfad-gruppe{cursor:pointer}
#plan .pfad-rand{fill:none;stroke:var(--s-weg);stroke-linecap:round;stroke-linejoin:round}
#plan .pfad-rand.gewaehlt{stroke:var(--auswahl)}
#plan .pfad-innen{fill:none;stroke:var(--f-weg);stroke-linecap:round;stroke-linejoin:round}
#plan .abstand{stroke:var(--blau);stroke-width:1.5px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .abstandsmass{fill:var(--blau);font-weight:650;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px;stroke-linejoin:round}
#plan .fuehrung{stroke:var(--auswahl);stroke-width:1px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.8}
#plan .rechtwinklig{fill:none;stroke:var(--auswahl);stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .winkelmass{fill:var(--leise);font-weight:700;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px}
#plan .winkelmass.genau{fill:var(--auswahl)}
#plan .zeichnung{fill:var(--auswahl);fill-opacity:.12;stroke:var(--auswahl);stroke-width:2px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .zeichnung-strich{fill:none;stroke:var(--blau);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .zeichnung-punkt{fill:var(--auswahl);pointer-events:none}
#plan .zeichnung-start{fill:#fff;stroke:var(--auswahl);stroke-width:2.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .dreh-stiel{stroke:var(--auswahl);stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .dreh-griff{fill:var(--karte);stroke:var(--auswahl);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:grab}
#plan .dreh-symbol{fill:var(--auswahl);font-weight:700;pointer-events:none}
#plan .kante-fang{stroke:var(--gelb);stroke-width:8px;stroke-linecap:round;opacity:.65;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .kante-hervor{fill:none;stroke:var(--gelb);stroke-width:7px;stroke-linecap:round;opacity:.7;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .aussenmass{fill:none;stroke:var(--leise);stroke-width:1px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .aussenmass-text{fill:var(--leise);font-weight:650;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px;stroke-linejoin:round}
.panel .formen{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.panel .formen .knopf{min-height:34px;padding:4px 10px;font-size:.88rem}
.panel .kanten .kantenart{min-height:32px;min-width:36px;padding:2px 8px;font-size:1rem}
.panel .kanten .kantenart.an{background:var(--gruen-hell);border-color:var(--gruen);color:var(--gruen-dunkel)}
.panel .kanten .winkel{min-width:34px;text-align:right}
#plan .griff{fill:#fff;stroke:var(--auswahl);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:move}
#plan .griff.aktiv{fill:var(--auswahl)}
#plan .neu{fill:var(--auswahl);opacity:.55;cursor:copy}
#plan .neu:hover{opacity:1}
#plan .neu-plus{stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
#plan .beschriftung{fill:var(--beschriftung);font-weight:600}
#plan .beschriftung.klein{font-weight:400;opacity:.75}
#plan .kantenmass{fill:var(--auswahl);font-weight:650;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px;stroke-linejoin:round}
.panel .karte{margin-bottom:12px}
.panel h2{font-size:1.05rem}
.panel label{display:block;font-size:.85rem;color:var(--leise);margin:8px 0 2px}
.panel .zwei{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .kanten{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.9rem}
.panel .kanten input{min-height:34px;padding:4px 8px}
.panel .knopfreihe .knopf{min-height:36px;padding:6px 12px;font-size:.92rem}
.objliste{list-style:none;margin:0;padding:0}
.objliste li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--linie);cursor:pointer}
.objliste li:hover{background:var(--karte2)}
.objliste li .leise{margin-left:auto;font-size:.8rem}
.objliste li .x{margin-left:6px;border:0;background:transparent;cursor:pointer;color:var(--leise);font-size:1rem;padding:2px 6px}

/* Anleitung */
.anleitung details{border-top:1px solid var(--linie);padding:10px 0}
.anleitung details:first-of-type{border-top:0}
.anleitung summary{cursor:pointer;font-weight:650;color:var(--gruen-dunkel)}
.anleitung details > div{padding-top:8px}

/* Willkommen */
#willkommen{
  position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
#willkommen .innen{max-width:460px;width:100%;text-align:center}
#willkommen .logo{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--marke);margin-bottom:6px}
#willkommen .logo img{height:120px}
#willkommen .logo svg{height:84px;width:auto}
#willkommen .unter{font-size:1.1rem;color:var(--erde);margin:0 0 22px;font-weight:550}
#willkommen .karte{text-align:left}

/* Dialog & Meldung */
dialog{
  border:0;border-radius:var(--radius);padding:20px;max-width:420px;width:calc(100% - 32px);
  background:var(--karte);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(20,24,18,.45)}
dialog .knopfreihe{justify-content:flex-end}
#meldung{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:60;background:var(--gruen-dunkel);color:#fff;padding:10px 16px;border-radius:10px;
  box-shadow:var(--schatten);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;
}
[data-theme="dark"] #meldung{background:#3d6e2a}
#meldung button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
@media (min-width:900px){ #meldung{bottom:24px} }
@media print{ #kopf,#leiste,#seitenleiste,.seitenkopf .kopf-knoepfe{display:none!important} body{display:block} }
</style>

<script>
"use strict";
/* ============================================================
   KRAUT UND RÜBEN – Gartenplaner
   ============================================================ */
const APP_VERSION = "0.3.0";
const SPEICHER_SCHLUESSEL = "kur-daten";
const WETTER_SCHLUESSEL = "kur-wetter";
const DATEN_SCHEMA = 1;

/* ---------- Reiter ---------- */
const REITER = [
  { id: "start",   name: "Start",   icon: "i-start" },
  { id: "garten",  name: "Garten",  icon: "i-garten" },
  { id: "planung", name: "Planung", icon: "i-planung" },
  { id: "chronik", name: "Chronik", icon: "i-chronik" },
  { id: "wissen",  name: "Wissen",  icon: "i-wissen" },
  { id: "vorrat",  name: "Vorrat",  icon: "i-vorrat" },
];
const SONDERSEITEN = { einstellungen: "Einstellungen", anleitung: "Anleitung" };

/* ============================================================
   DATEN
   Alles liegt als ein Objekt im Browser-Speicher (localStorage).
   ============================================================ */
function leereDaten() {
  return {
    schema: DATEN_SCHEMA,
    einstellungen: { standort: null, design: "auto", willkommenGesehen: false },
    garten: { objekte: [], bereiche: [], raster: 10 },  // Maße in cm
    pflanzungen: [],   // was wirklich im Garten steht oder stand
    planungen: [],     // Entwürfe für kommende Jahreszeiten
    sorten: [],        // eigene Sorten mit Bewertung
    saatgut: [],       // Saatgutvorrat
    rezepte: [],       // eigene Rezeptsammlung
    eigenePflanzen: [], // selbst angelegte Pflanzen fürs Lexikon
    pflanzenNotizen: {}, // eigene Notizen je Pflanze (id → Text)
    geaendert: null,
  };
}

let D = laden();

function laden() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (!roh) return leereDaten();
    return ergaenzen(JSON.parse(roh));
  } catch (e) {
    console.error("Daten konnten nicht gelesen werden:", e);
    return leereDaten();
  }
}

/* Fehlende Felder (z. B. nach einem Update) mit Standardwerten auffüllen */
function ergaenzen(d) {
  const basis = leereDaten();
  const neu = Object.assign(basis, d);
  neu.einstellungen = Object.assign(leereDaten().einstellungen, d.einstellungen || {});
  neu.garten = Object.assign(leereDaten().garten, d.garten || {});
  return neu;
}

function speichern() {
  D.geaendert = new Date().toISOString();
  try {
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(D));
    return true;
  } catch (e) {
    console.error(e);
    melden("Speichern hat nicht geklappt: " + e.message);
    return false;
  }
}

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
}
const icon = id => `<svg class="icon"><use href="#${id}"/></svg>`;
const WOCHENTAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const WOCHENTAGE_LANG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
function datumText(d) { return `${d.getDate()}. ${MONATE[d.getMonth()]} ${d.getFullYear()}`; }
function zeitText(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE") + ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
}
function heuteISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function zahl(n, stellen = 0) {
  let x = Number(n);
  if (Math.abs(x) < 0.5 * Math.pow(10, -stellen)) x = 0; // verhindert „-0“
  return x.toLocaleString("de-DE", { maximumFractionDigits: stellen, minimumFractionDigits: stellen });
}

/* Kurze Meldung unten */
let meldungTimer;
function melden(text, aktion) {
  const m = $("#meldung");
  m.innerHTML = `<span>${esc(text)}</span>`;
  if (aktion) {
    const b = document.createElement("button");
    b.textContent = aktion.text;
    b.onclick = () => { m.classList.add("verborgen"); aktion.tun(); };

/* Dialog mit Eingabefeldern. Liefert die Werte oder null (Abbrechen). */
function eingabe({ titel, text = "", felder, ja = "OK" }) {
  return new Promise(fertig => {
    const dlg = $("#dialog");
    dlg.innerHTML = `<h2 tabindex="-1" autofocus>${esc(titel)}</h2>${text ? `<p>${text}</p>` : ""}
      <form method="dialog" class="felder">
        ${felder.map(f => `<label>${esc(f.label)}
          <span class="feld-einheit"><input name="${f.id}" type="${f.typ || "text"}" ${f.typ === "number" ? `step="${f.schritt || "any"}" min="${f.min ?? ""}" inputmode="decimal"` : ""} value="${esc(f.wert ?? "")}">${f.einheit ? `<span>${esc(f.einheit)}</span>` : ""}</span></label>`).join("")}
        <div class="knopfreihe">
          <button type="button" class="knopf" data-a="0">Abbrechen</button>
          <button type="submit" class="knopf haupt" data-a="1">${esc(ja)}</button>
        </div>
      </form>`;
    const form = $("form", dlg);
    const zu = ok => {
      const werte = {};
      felder.forEach(f => { const v = form.elements[f.id].value; werte[f.id] = f.typ === "number" ? parseFloat(String(v).replace(",", ".")) : v.trim(); });
      dlg.close(); fertig(ok ? werte : null);

    form.onsubmit = e => { e.preventDefault(); zu(true); };

    dlg.showModal();
  });
}

/* ============================================================
   STANDORT (Ortssuche über Open-Meteo)
   ============================================================ */
function ortsauswahl(ziel, nachher) {
  ziel.innerHTML = `
    <div class="suchzeile">
      <input type="search" placeholder="Ort oder Postleitzahl" aria-label="Ort suchen" autocomplete="off">
      <button class="knopf haupt">Suchen</button>
    </div>
    <button class="knopf text" data-gps>${icon("i-ort")} Aktuellen Standort verwenden</button>
    <ul class="liste"></ul>
    <p class="klein leise ort-info"></p>`;
  const feld = $("input", ziel), liste = $("ul", ziel), info = $(".ort-info", ziel);

  async function suchen() {
    const q = feld.value.trim();
    if (q.length < 2) { info.textContent = "Bitte mindestens zwei Zeichen eingeben."; return; }
    info.textContent = "Suche läuft …";
    liste.innerHTML = "";
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=de&format=json`;
      const r = await fetch(url);
      if (!r.ok) throw new Error("Server antwortet mit " + r.status);
      const j = await r.json();
      const treffer = j.results || [];
      if (!treffer.length) { info.textContent = "Kein Ort gefunden. Versuch es mit einer anderen Schreibweise."; return; }
      info.textContent = "Bitte den richtigen Ort antippen:";
      liste.innerHTML = treffer.map((t, i) => {
        const zusatz = [t.postcodes?.[0], t.admin1, t.country].filter(Boolean).join(", ");
        return `<li><button data-i="${i}"><b>${esc(t.name)}</b> <span class="leise klein">${esc(zusatz)}</span></button></li>`;
      }).join("");
      $$("button", liste).forEach(b => b.onclick = () => {
        const t = treffer[+b.dataset.i];
        uebernehmen({ name: [t.name, t.admin1].filter(Boolean).join(", "), lat: t.latitude, lon: t.longitude });
      });
    } catch (e) {
      info.textContent = "Die Ortssuche hat nicht geklappt (" + e.message + "). Bist du online?";
    }
  }
  function uebernehmen(ort) {
    D.einstellungen.standort = ort;
    speichern();
    localStorage.removeItem(WETTER_SCHLUESSEL);
    melden("Standort gespeichert: " + ort.name);
    nachher && nachher();
  }
  $(".suchzeile button", ziel).onclick = suchen;
  feld.addEventListener("keydown", e => { if (e.key === "Enter") suchen(); });
  $("[data-gps]", ziel).onclick = () => {
    if (!navigator.geolocation) { info.textContent = "Dein Browser kann den Standort nicht ermitteln."; return; }
    info.textContent = "Standort wird ermittelt …";
    navigator.geolocation.getCurrentPosition(
      p => uebernehmen({ name: "Mein Garten (per Standortfreigabe)", lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }),
      () => { info.textContent = "Der Standort konnte nicht ermittelt werden. Such stattdessen nach deinem Ort."; },
      { timeout: 10000 }
    );
  };
}

/* ============================================================
   WETTER (Open-Meteo, ohne Anmeldung)
   Tiefstwert ≤ 0 °C  → Frost
   Tiefstwert unter 4 °C → Bodenfrost möglich (am Boden oft einige Grad kälter als in 2 m Höhe)
   Höchstwert ab 30 °C → Hitze
   Trockenphase: letzte 7 Tage unter 5 mm Regen und nächste 3 Tage unter 3 mm, bei mindestens 12 °C am Tag
   ============================================================ */
const GRENZEN = { frost: 0, bodenfrost: 4, hitze: 30, trockenVorher: 5, trockenNachher: 3, trockenWaerme: 12 };

const WETTERCODES = {
  0: ["☀️", "Klar"], 1: ["🌤️", "Überwiegend klar"], 2: ["⛅", "Teils bewölkt"], 3: ["☁️", "Bedeckt"],
  45: ["🌫️", "Nebel"], 48: ["🌫️", "Nebel mit Reif"],
  51: ["🌦️", "Leichter Niesel"], 53: ["🌦️", "Niesel"], 55: ["🌧️", "Starker Niesel"], 56: ["🌧️", "Gefrierender Niesel"], 57: ["🌧️", "Gefrierender Niesel"],
  61: ["🌧️", "Leichter Regen"], 63: ["🌧️", "Regen"], 65: ["🌧️", "Starker Regen"], 66: ["🌧️", "Gefrierender Regen"], 67: ["🌧️", "Gefrierender Regen"],
  71: ["🌨️", "Leichter Schnee"], 73: ["🌨️", "Schnee"], 75: ["❄️", "Starker Schnee"], 77: ["🌨️", "Schneegriesel"],
  80: ["🌦️", "Regenschauer"], 81: ["🌦️", "Regenschauer"], 82: ["⛈️", "Heftige Schauer"],
  85: ["🌨️", "Schneeschauer"], 86: ["🌨️", "Schneeschauer"],
  95: ["⛈️", "Gewitter"], 96: ["⛈️", "Gewitter mit Hagel"], 99: ["⛈️", "Gewitter mit Hagel"],
};

async function wetterHolen() {
  const ort = D.einstellungen.standort;
  if (!ort) return null;
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(WETTER_SCHLUESSEL) || "null"); } catch (e) {}
  const passt = cache && cache.lat === ort.lat && cache.lon === ort.lon;
  if (passt && Date.now() - cache.zeit < 60 * 60 * 1000) return cache;
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + ort.lat + "&longitude=" + ort.lon +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max" +
      "&past_days=7&forecast_days=7&timezone=auto";
    const r = await fetch(url);
    if (!r.ok) throw new Error("Server antwortet mit " + r.status);
    const j = await r.json();
    const neu = { lat: ort.lat, lon: ort.lon, zeit: Date.now(), daily: j.daily };
    localStorage.setItem(WETTER_SCHLUESSEL, JSON.stringify(neu));
    return neu;
  } catch (e) {
    console.warn("Wetter konnte nicht geladen werden:", e);
    if (passt) return Object.assign({ veraltet: true }, cache);
    throw e;
  }
}

/* Tage in Vergangenheit und Vorhersage aufteilen */
function wetterAufbereiten(w) {
  const d = w.daily, heute = heuteISO(), tage = [];
  d.time.forEach((t, i) => tage.push({
    datum: t, code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i],
    regen: d.precipitation_sum[i] ?? 0, chance: d.precipitation_probability_max?.[i],
  }));
  return { vorher: tage.filter(t => t.datum < heute), kommend: tage.filter(t => t.datum >= heute) };
}

function tagName(iso, lang = false) {
  if (iso === heuteISO()) return "heute";
  const d = new Date(iso + "T12:00:00");
  const morgen = new Date(); morgen.setDate(morgen.getDate() + 1);
  if (d.toDateString() === morgen.toDateString()) return "morgen";
  return (lang ? WOCHENTAGE_LANG : WOCHENTAGE)[d.getDay()];
}

function wetterHinweise({ vorher, kommend }) {
  const h = [];
  const frostTage = kommend.filter(t => t.min <= GRENZEN.frost);
  const bodenTage = kommend.filter(t => t.min > GRENZEN.frost && t.min < GRENZEN.bodenfrost);
  if (frostTage.length) {
    const kalt = frostTage.reduce((a, b) => (b.min < a.min ? b : a));
    h.push({ art: "frost", sym: "❄️", titel: "Frost erwartet",
      text: `Tiefstwerte bis ${zahl(kalt.min, 1)} °C (${frostTage.map(t => tagName(t.datum)).join(", ")}). Empfindliche Pflanzen abdecken oder hereinholen, Gießwasser und Leitungen schützen.` });
  } else if (bodenTage.length) {
    const kalt = bodenTage.reduce((a, b) => (b.min < a.min ? b : a));
    h.push({ art: "frost", sym: "🌡️", titel: "Bodenfrost möglich",
      text: `Tiefstwert ${zahl(kalt.min, 1)} °C (${bodenTage.map(t => tagName(t.datum)).join(", ")}). In klaren, windstillen Nächten kann es am Boden einige Grad kälter sein als angezeigt.` });
  }
  const heiss = kommend.filter(t => t.max >= GRENZEN.hitze);
  if (heiss.length) {
    const max = Math.max(...heiss.map(t => t.max));
    h.push({ art: "hitze", sym: "🔥", titel: "Hitze",
      text: `Bis ${zahl(max, 0)} °C (${heiss.map(t => tagName(t.datum)).join(", ")}). Früh morgens oder abends gießen, empfindliche Pflanzen schattieren.` });
  }
  const regenVorher = vorher.reduce((s, t) => s + (t.regen || 0), 0);
  const naechste3 = kommend.slice(0, 3);
  const regenNachher = naechste3.reduce((s, t) => s + (t.regen || 0), 0);
  const warm = naechste3.length && naechste3.reduce((s, t) => s + t.max, 0) / naechste3.length >= GRENZEN.trockenWaerme;
  if (vorher.length >= 5 && regenVorher < GRENZEN.trockenVorher && regenNachher < GRENZEN.trockenNachher && warm) {
    h.push({ art: "warn", sym: "💧", titel: "Trockenphase",
      text: `In den letzten 7 Tagen nur ${zahl(regenVorher, 1)} mm Regen, und auch in den nächsten Tagen kommt kaum etwas dazu. Beete, Jungpflanzen und Kübel gießen.` });
  }
  if (!h.length) h.push({ art: "ok", sym: "✅", titel: "Keine Warnungen", text: "Kein Frost, keine Hitze und keine Trockenphase in Sicht." });
  return { hinweise: h, regenVorher };
}

async function wetterKarte(ziel) {
  const ort = D.einstellungen.standort;
  if (!ort) {
    ziel.innerHTML = `<h2>🌦️ Wetter</h2>
      <p>Trag deinen Standort ein, dann siehst du hier die Vorhersage mit Frost- und Trockenwarnungen.</p>
      <a class="knopf haupt" href="#einstellungen">${icon("i-ort")} Standort eintragen</a>`;
    return;
  }
  ziel.innerHTML = `<h2>🌦️ Wetter <span class="leise klein" style="font-weight:400">· ${esc(ort.name)}</span></h2><p class="leise">Wetter wird geladen …</p>`;
  let w;
  try { w = await wetterHolen(); }
  catch (e) {
    ziel.innerHTML = `<h2>🌦️ Wetter</h2><p>Das Wetter konnte gerade nicht geladen werden. Bist du online?</p>
      <p class="klein leise">Technischer Grund: ${esc(e.message)}</p>`;
    return;
  }
  const auf = wetterAufbereiten(w);

  const tage = auf.kommend.slice(0, 7).map(t => {
    const [sym, text] = WETTERCODES[t.code] || ["❔", "Unbekannt"];
    const frost = t.min <= GRENZEN.frost || t.min < GRENZEN.bodenfrost;
    return `<div class="tag ${t.datum === heuteISO() ? "heute" : ""}" title="${esc(text)}">
      <div class="wt">${t.datum === heuteISO() ? "Heute" : WOCHENTAGE[new Date(t.datum + "T12:00:00").getDay()]}</div>
      <div class="sym" aria-label="${esc(text)}">${sym}</div>
      <div class="max">${zahl(t.max, 0)}°</div>
      <div class="min ${frost ? "frost" : ""}">${zahl(t.min, 0)}°</div>
      <div class="regen">${t.regen >= 0.5 ? zahl(t.regen, 0) + " mm" : ""}</div>
    </div>`;
  }).join("");
  ziel.innerHTML = `<h2>🌦️ Wetter <span class="leise klein" style="font-weight:400">· ${esc(ort.name)}</span></h2>
    <div class="wettertage">${tage}</div>
    ${hinweise.map(x => `<div class="hinweis ${x.art}"><span class="sym">${x.sym}</span><div><b>${esc(x.titel)}</b>${esc(x.text)}</div></div>`).join("")}
    <p class="klein leise" style="margin:10px 0 0">Regen in den letzten 7 Tagen: ${zahl(regenVorher, 1)} mm ·
    ${w.veraltet ? "Offline – Stand vom " + zeitText(w.zeit) : "Stand: " + new Date(w.zeit).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr"}</p>`;
}

/* ============================================================
   SEITEN
   ============================================================ */
/* ============================================================
   WISSEN: PFLANZENLEXIKON, KALENDER, QUELLEN
   Die Pflanzendaten stehen in pflanzen.js (PFLANZEN, FAMILIEN, MISCHKULTUR, QUELLEN).
   Eigene Pflanzen und Notizen liegen in den Nutzerdaten (D.eigenePflanzen, D.pflanzenNotizen).
   ============================================================ */
const LEX_OK = typeof PFLANZEN !== "undefined";
const MON_KURZ = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const TAETIGKEITEN = [
  { feld: "vorziehen", name: "Vorziehen", kurz: "vorziehen", farbe: "var(--t-vor)" },
  { feld: "direktsaat", name: "Direkt säen", kurz: "säen", farbe: "var(--t-saat)" },
  { feld: "pflanzen", name: "Pflanzen / Stecken", kurz: "pflanzen", farbe: "var(--t-pflanz)" },
  { feld: "ernte", name: "Ernten", kurz: "ernten", farbe: "var(--t-ernte)" },
];
const ZEHRER = { stark: "Starkzehrer (hoher Nährstoffbedarf)", mittel: "Mittelzehrer", schwach: "Schwachzehrer (geringer Nährstoffbedarf)" };
const FROST = { empfindlich: "frostempfindlich – erst nach den Eisheiligen ins Freie", leicht: "verträgt leichten Frost", hart: "winterhart / frosthart" };
const SAATGUT = {
  leicht: "leicht – Selbstbefruchter, Sorten kreuzen sich kaum",
  mittel: "mittel – Fremdbefruchter, Sorten können sich kreuzen",
  schwer: "schwierig – Fremdbefruchter, meist zweijährige Samenbildung",
  vegetativ: "wird über Knollen bzw. Zehen vermehrt",
};

function allePflanzen() {
  const eigene = (D.eigenePflanzen || []).map(p => Object.assign({ eigen: true, quellen: [], hinweise: [] }, p));
  return [...(LEX_OK ? PFLANZEN : []), ...eigene].sort((a, b) => a.name.localeCompare(b.name, "de"));
}
const pflanzeVon = id => allePflanzen().find(p => p.id === id);
function familieVon(p) { return (LEX_OK && FAMILIEN[p.familie]) || { name: p.familieText || "–", pause: null, farbe: "#8a8f80" }; }
function nachbarn(id) {
  const r = { gut: [], schlecht: [], umstritten: [] };
  if (!LEX_OK) return r;
  for (const m of MISCHKULTUR) {
    const anderer = m.a === id ? m.b : m.b === id ? m.a : null;
    if (anderer && pflanzeVon(anderer)) r[m.art].push({ id: anderer, notiz: m.notiz, quelle: m.quelle });
  }
  for (const k in r) r[k].sort((a, b) => pflanzeVon(a.id).name.localeCompare(pflanzeVon(b.id).name, "de"));
  return r;
}
function pflanzenBadge(p, gross) {
  const f = familieVon(p);
  return `<span class="p-badge${gross ? " gross" : ""}" style="background:${f.farbe}" aria-hidden="true">${esc(p.name.slice(0, 2))}</span>`;
}
function monateText(liste) {
  if (!liste || !liste.length) return "–";
  // zusammenhängende Bereiche bilden, auch über den Jahreswechsel
  const set = new Set(liste), teile = [];
  let start = [...Array(12).keys()].map(i => i + 1).find(mo => set.has(mo) && !set.has(mo === 1 ? 12 : mo - 1));
  if (start === undefined) return "ganzjährig";
  for (let i = 0, mo = start; i < 12; i++, mo = mo === 12 ? 1 : mo + 1) {
    if (set.has(mo) && !set.has(mo === 1 ? 12 : mo - 1)) {
      let ende = mo; while (set.has(ende === 12 ? 1 : ende + 1) && (ende === 12 ? 1 : ende + 1) !== mo) ende = ende === 12 ? 1 : ende + 1;
      teile.push(ende === mo ? MONATE[mo - 1] : `${MONATE[mo - 1]} bis ${MONATE[ende - 1]}`);
    }
  }
  return teile.join(", ");
}
function jahresleiste(p, klein) {
  const jetzt = new Date().getMonth() + 1;
  return `<div class="jahr${klein ? " klein" : ""}">${MON_KURZ.map((n, i) => {
    const mo = i + 1, an = TAETIGKEITEN.filter(t => (p[t.feld] || []).includes(mo));
    return `<span class="jm${mo === jetzt ? " jetzt" : ""}" title="${MONATE[i]}${an.length ? ": " + an.map(t => t.name).join(", ") : ""}">${an.map(t => `<i style="background:${t.farbe}"></i>`).join("")}</span>`;
  }).join("")}</div>`;
}
function legende() {
  return `<div class="legende">${TAETIGKEITEN.map(t => `<span><i style="background:${t.farbe}"></i>${t.name}</span>`).join("")}</div>`;
}

/* ---------- Seite „Wissen“ mit Unterbereichen ---------- */
function wissenSeite(main) {
  const teile = location.hash.replace("#", "").split("/");
  const bereich = teile[1] || "pflanzen";
  seitentitel(main, "Wissen");
  if (!LEX_OK) { main.insertAdjacentHTML("beforeend", `<div class="karte"><p>Die Pflanzendaten (Datei <code>pflanzen.js</code>) konnten nicht geladen werden. Liegt die Datei im Repository neben der index.html?</p></div>`); return; }
  if (bereich === "pflanze") return pflanzenDetail(main, decodeURIComponent(teile[2] || ""));
  if (bereich === "eigene") return eigenePflanzeForm(main, teile[2] ? decodeURIComponent(teile[2]) : null);
  main.insertAdjacentHTML("beforeend", `<div class="unternav">
    ${[["pflanzen", "🌱 Pflanzen"], ["kalender", "🗓️ Kalender"], ["quellen", "📚 Quellen"]].map(([k, n]) => `<a href="#wissen/${k}" class="${bereich === k ? "an" : ""}">${n}</a>`).join("")}
  </div>`);
  if (bereich === "kalender") return kalenderAnsicht(main);
  if (bereich === "quellen") return quellenAnsicht(main);
  pflanzenListe(main);
}

let lexFilter = { text: "", gruppe: "alle", jetzt: false };
function pflanzenListe(main) {
  main.insertAdjacentHTML("beforeend", `
    <div class="lex-werkzeug">
      <input type="search" id="lex-suche" placeholder="Pflanze suchen …" aria-label="Pflanze suchen" value="${esc(lexFilter.text)}">
      <div class="umschalter" id="lex-gruppe">${["alle", "Gemüse", "Kräuter"].map(g => `<button data-g="${g}" class="${lexFilter.gruppe === g ? "an" : ""}">${g === "alle" ? "Alle" : g}</button>`).join("")}</div>
      <label class="schalter-klein"><input type="checkbox" id="lex-jetzt" ${lexFilter.jetzt ? "checked" : ""}> Nur was im ${MONATE[new Date().getMonth()]} ansteht</label>
      <a class="knopf" href="#wissen/eigene">＋ Eigene Pflanze</a>
    </div>
    ${legende()}
    <div class="lex-raster" id="lex-raster"></div>
    <div style="margin-top:14px">${baldKarte("Kommt noch in „Wissen“", [
      "Weitere Pflanzen: Obst, Beeren und mehr Kräuter",
      "Deine Sorten mit Bewertung und Erfahrungen",
      "Übersichten zu Mischkultur, Fruchtfolge und Saatgut-Gewinnung",
    ])}</div>`);
  const zeichnen = () => {
    const t = lexFilter.text.toLowerCase().trim(), mo = new Date().getMonth() + 1;
    const liste = allePflanzen().filter(p =>
      (lexFilter.gruppe === "alle" || p.gruppe === lexFilter.gruppe) &&
      (!t || p.name.toLowerCase().includes(t) || (p.auch || []).some(a => a.toLowerCase().includes(t))) &&
      (!lexFilter.jetzt || TAETIGKEITEN.some(x => (p[x.feld] || []).includes(mo))));
    $("#lex-raster").innerHTML = liste.length ? liste.map(p => `
      <a class="lex-karte" href="#wissen/pflanze/${encodeURIComponent(p.id)}">
        <div class="kopf">${pflanzenBadge(p)}<div><b>${esc(p.name)}</b>${p.eigen ? ` <span class="marker">eigene</span>` : ""}<div class="klein leise">${esc(familieVon(p).name.replace(/\s*\(.*\)/, ""))}</div></div></div>
        ${jahresleiste(p, true)}
      </a>`).join("") : `<p class="leise">Keine Pflanze gefunden.</p>`;
  };
  $("#lex-suche").addEventListener("input", e => { lexFilter.text = e.target.value; zeichnen(); });
  $$("#lex-gruppe button").forEach(b => b.onclick = () => { lexFilter.gruppe = b.dataset.g; $$("#lex-gruppe button").forEach(x => x.classList.toggle("an", x === b)); zeichnen(); });
  $("#lex-jetzt").onchange = e => { lexFilter.jetzt = e.target.checked; zeichnen(); };
  zeichnen();
}

function pflanzenDetail(main, id) {
  const p = pflanzeVon(id);
  if (!p) { main.insertAdjacentHTML("beforeend", `<div class="karte"><p>Diese Pflanze gibt es nicht (mehr).</p><a class="knopf" href="#wissen">← Zum Lexikon</a></div>`); return; }
  const f = familieVon(p), n = nachbarn(p.id), jetzt = new Date().getMonth() + 1;
  const pause = p.pause || f.pause;
  const keim = p.keimJahre ? (p.keimJahre[0] === p.keimJahre[1] ? `${p.keimJahre[0] >= 5 ? "über 5" : p.keimJahre[0]} Jahre` : `${p.keimJahre[0]}–${p.keimJahre[1]} Jahre`) : (p.saatgut === "vegetativ" ? "– (keine Samen)" : "–");
  const zeile = (l, w) => w ? `<div class="sb-l">${l}</div><div class="sb-w">${w}</div>` : "";
  const chips = (liste, art) => liste.length ? liste.map(x => `<a class="chip ${art}" href="#wissen/pflanze/${encodeURIComponent(x.id)}" ${x.notiz ? `title="${esc(x.notiz)}"` : ""}>${esc(pflanzeVon(x.id).name)}${x.notiz ? " *" : ""}</a>`).join("") : `<span class="leise klein">keine Angaben</span>`;
  const notizen = n.gut.concat(n.schlecht, n.umstritten).filter(x => x.notiz);
  main.insertAdjacentHTML("beforeend", `
    <a class="zurueck" href="#wissen">← Alle Pflanzen</a>
    <div class="lex-kopf">${pflanzenBadge(p, true)}<div><h2>${esc(p.name)}${p.eigen ? ` <span class="marker">eigene</span>` : ""}</h2>
      ${(p.auch || []).length ? `<div class="leise klein">auch: ${esc(p.auch.join(", "))}</div>` : ""}</div>
      ${p.eigen ? `<a class="knopf" style="margin-left:auto" href="#wissen/eigene/${encodeURIComponent(p.id)}">✏️ Bearbeiten</a>` : ""}</div>
    <div class="raster zwei">
      <div>
        <div class="karte"><h2>🗓️ Anbaukalender</h2>
          <div class="kal-tabelle">
            <div></div>${MON_KURZ.map((m, i) => `<div class="kal-mon${i + 1 === jetzt ? " jetzt" : ""}">${m[0]}</div>`).join("")}
            ${TAETIGKEITEN.map(t => `<div class="kal-name">${t.name}</div>${MON_KURZ.map((_, i) => `<div class="kal-zelle${i + 1 === jetzt ? " jetzt" : ""}" ${(p[t.feld] || []).includes(i + 1) ? `style="background:${t.farbe}"` : ""}></div>`).join("")}`).join("")}
          </div>
          <div class="kal-text klein">${TAETIGKEITEN.filter(t => (p[t.feld] || []).length).map(t => `<div><b>${t.name}:</b> ${monateText(p[t.feld])}</div>`).join("")}</div>
        </div>
        ${p.anleitung ? `<div class="karte"><h2>🌿 Anbau in Kürze</h2><p style="margin:0">${esc(p.anleitung)}</p></div>` : ""}
        <div class="karte"><h2>🤝 Nachbarn im Beet</h2>
          <div class="nb-gruppe"><div class="nb-titel">Gute Nachbarn</div>${chips(n.gut, "gut")}</div>
          <div class="nb-gruppe"><div class="nb-titel">Schlechte Nachbarn</div>${chips(n.schlecht, "schlecht")}</div>
          ${n.umstritten.length ? `<div class="nb-gruppe"><div class="nb-titel">Umstritten</div>${chips(n.umstritten, "umstritten")}</div>` : ""}
          ${notizen.length ? `<div class="klein leise" style="margin-top:8px">${notizen.map(x => `* ${esc(pflanzeVon(x.id).name)}: ${esc(x.notiz)}`).join("<br>")}</div>` : ""}
          <p class="klein leise" style="margin:8px 0 0">Mischkultur beruht vor allem auf Erfahrungswerten; die Wirkung ist wissenschaftlich kaum belegt. Wichtiger ist genug Abstand.</p>
        </div>
      </div>
      <div>
        <div class="karte"><h2>📋 Steckbrief</h2>
          <div class="steckbrief">
            ${zeile("Gruppe", esc(p.gruppe || "–") + (p.mehrjaehrig ? " · mehrjährig" : ""))}
            ${zeile("Familie", esc(f.name))}
            ${zeile("Nährstoffbedarf", esc(ZEHRER[p.zehrer] || "–"))}
            ${zeile("Standort", esc(p.standort || "–"))}
            ${zeile("Frost", esc(FROST[p.frost] || "–"))}
            ${zeile("Abstand", p.abstand ? `${p.abstand[0]} cm zwischen den Reihen, ${p.abstand[1]} cm in der Reihe${p.abstandHinweis ? `<br><span class="leise">${esc(p.abstandHinweis)}</span>` : ""}` : "–")}
            ${zeile("Saattiefe", esc(p.saattiefe || "–") + (p.keimung ? `<br><span class="leise">${esc(p.keimung)}</span>` : ""))}
            ${zeile("Anbaupause", pause ? `${esc(pause)} für die ganze Familie (${esc(f.name)})` : "keine Angabe")}
            ${zeile("Samen keimfähig", esc(keim))}
            ${zeile("Samen selbst gewinnen", esc(SAATGUT[p.saatgut] || "keine Angabe"))}
          </div>
          <p class="klein leise" style="margin:10px 0 0">Saattiefe und Zeiten sind Richtwerte – die Angaben auf der Samentüte haben Vorrang.</p>
        </div>
        ${(p.hinweise || []).length ? `<div class="karte hinweis-karte"><h2>⚠️ Unterschiedliche Angaben</h2><ul>${p.hinweise.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>` : ""}
        <div class="karte"><h2>📝 Meine Notizen</h2>
          <textarea id="p-notiz" rows="4" placeholder="Eigene Erfahrungen, Lieblingssorten, Tipps …">${esc((D.pflanzenNotizen || {})[p.id] || "")}</textarea>
          <p class="klein leise" id="p-notiz-stand" style="margin:4px 0 0"></p>
        </div>
        ${(p.quellen || []).length ? `<div class="karte"><h2>📚 Quellen</h2><ul class="quellen">${p.quellen.filter(q => QUELLEN[q]).map(q => `<li><a href="${QUELLEN[q].url}" target="_blank" rel="noopener">${esc(QUELLEN[q].titel)}</a></li>`).join("")}</ul></div>` : ""}
      </div>
    </div>`);
  let t;
  $("#p-notiz").addEventListener("input", e => {
    clearTimeout(t);
    t = setTimeout(() => {
      D.pflanzenNotizen = D.pflanzenNotizen || {};
      const v = e.target.value.trim();
      if (v) D.pflanzenNotizen[p.id] = e.target.value; else delete D.pflanzenNotizen[p.id];
      speichern(); $("#p-notiz-stand").textContent = "Gespeichert.";
    }, 500);
  });
}

/* ---------- Kalender: Monat und Jahresübersicht ---------- */
let kalMonat = new Date().getMonth() + 1;
function monatsListen(mo) {
  return TAETIGKEITEN.map(t => ({ ...t, pflanzen: allePflanzen().filter(p => (p[t.feld] || []).includes(mo)) }));
}
function kalenderAnsicht(main) {
  main.insertAdjacentHTML("beforeend", `
    <div class="karte">
      <div class="monatswahl">
        <button class="knopf" id="kal-zurueck" aria-label="Vormonat">‹</button>
        <h2 id="kal-titel" style="margin:0"></h2>
        <button class="knopf" id="kal-vor" aria-label="Nächster Monat">›</button>
        <button class="knopf text" id="kal-heute">Heute</button>
      </div>
      <div id="kal-monat"></div>
    </div>
    <div class="karte"><h2>Jahresübersicht</h2>${legende()}
      <div class="jahres-tabelle">
        <div class="jt-kopf"><span></span><div class="jahr">${MON_KURZ.map((m, i) => `<span class="${i + 1 === new Date().getMonth() + 1 ? "jetzt" : ""}">${m}</span>`).join("")}</div></div>
        ${allePflanzen().map(p => `<a class="jt-zeile" href="#wissen/pflanze/${encodeURIComponent(p.id)}"><span class="jt-name">${esc(p.name)}</span>${jahresleiste(p)}</a>`).join("")}
      </div>
    </div>`);
  const zeichnen = () => {
    $("#kal-titel").textContent = MONATE[kalMonat - 1];
    $("#kal-monat").innerHTML = monatsListen(kalMonat).map(t => `
      <div class="kal-gruppe"><div class="kal-gruppe-titel"><i style="background:${t.farbe}"></i>${t.name} <span class="leise">(${t.pflanzen.length})</span></div>
        ${t.pflanzen.length ? t.pflanzen.map(p => `<a class="chip" href="#wissen/pflanze/${encodeURIComponent(p.id)}">${esc(p.name)}</a>`).join("") : `<span class="leise klein">nichts</span>`}
      </div>`).join("");
  };
  $("#kal-zurueck").onclick = () => { kalMonat = kalMonat === 1 ? 12 : kalMonat - 1; zeichnen(); };
  $("#kal-vor").onclick = () => { kalMonat = kalMonat === 12 ? 1 : kalMonat + 1; zeichnen(); };
  $("#kal-heute").onclick = () => { kalMonat = new Date().getMonth() + 1; zeichnen(); };
  zeichnen();
}

function quellenAnsicht(main) {
  main.insertAdjacentHTML("beforeend", `
    <div class="karte"><h2>📚 Woher die Angaben stammen</h2>
      <p>Alle Texte im Lexikon sind in eigenen Worten geschrieben. Die Werte stammen aus diesen Quellen und wurden untereinander abgeglichen. Wo sich Quellen widersprechen, steht das bei der jeweiligen Pflanze unter „Unterschiedliche Angaben“.</p>
      <ul class="quellen">${Object.values(QUELLEN).map(q => `<li><a href="${q.url}" target="_blank" rel="noopener">${esc(q.titel)}</a></li>`).join("")}</ul>
      <p class="klein leise" style="margin:0">Stand der Pflanzendaten: ${new Date(PFLANZEN_STAND).toLocaleDateString("de-DE")} · ${PFLANZEN.length} Pflanzen. Saattiefen und Keimhinweise sind allgemeine Richtwerte; im Zweifel gilt die Samentüte.</p>
    </div>
    <div class="karte"><h2>Gut zu wissen</h2>
      <ul class="klein" style="margin:0;padding-left:18px">
        <li><b>Zeiten</b> gelten für durchschnittliche Lagen in Deutschland. In rauen Lagen eher später, im Weinbauklima eher früher beginnen. Frostempfindliches erst nach den Eisheiligen (Mitte Mai) ins Freie.</li>
        <li><b>Mischkultur:</b> Die Bayerische Gartenakademie weist darauf hin, dass sich die Wirkung guter und schlechter Nachbarn kaum nachweisen lässt und Tabellen sich oft widersprechen. Der häufigste Fehler ist ein zu enger Stand.</li>
        <li><b>Anbaupause</b> gilt für die ganze Pflanzenfamilie: Nach Tomaten also auch keine Kartoffeln an dieselbe Stelle.</li>
        <li><b>Keimfähigkeit</b> hängt stark von der Lagerung ab (kühl, trocken, dunkel). Ältere Samen vor der Aussaat mit einer Keimprobe testen.</li>
      </ul>
    </div>`);
}

/* ---------- Eigene Pflanzen ---------- */
function eigenePflanzeForm(main, id) {
  const alt = id ? (D.eigenePflanzen || []).find(p => p.id === id) : null;
  const p = alt || { name: "", gruppe: "Gemüse", familie: "", zehrer: "mittel", abstand: [30, 30], vorziehen: [], direktsaat: [], pflanzen: [], ernte: [], anleitung: "" };
  main.insertAdjacentHTML("beforeend", `
    <a class="zurueck" href="${alt ? `#wissen/pflanze/${encodeURIComponent(alt.id)}` : "#wissen"}">← Zurück</a>
    <div class="karte formular">
      <h2>${alt ? "Eigene Pflanze bearbeiten" : "Eigene Pflanze anlegen"}</h2>
      <p class="klein leise">Für Pflanzen, die (noch) nicht im Lexikon stehen. Nur der Name ist Pflicht.</p>
      <label>Name<input type="text" id="e-name" value="${esc(p.name)}"></label>
      <div class="zwei-spalten">
        <label>Gruppe<select id="e-gruppe">${["Gemüse", "Kräuter", "Obst", "Blumen", "Sonstiges"].map(g => `<option ${p.gruppe === g ? "selected" : ""}>${g}</option>`).join("")}</select></label>
        <label>Familie<select id="e-familie"><option value="">unbekannt</option>${Object.entries(FAMILIEN).map(([k, f]) => `<option value="${k}" ${p.familie === k ? "selected" : ""}>${esc(f.name)}</option>`).join("")}</select></label>
        <label>Nährstoffbedarf<select id="e-zehrer">${Object.keys(ZEHRER).map(z => `<option value="${z}" ${p.zehrer === z ? "selected" : ""}>${z[0].toUpperCase() + z.slice(1)}zehrer</option>`).join("")}</select></label>
        <label>Abstand Reihe / Pflanze (cm)<span class="feld-einheit"><input type="number" id="e-ar" min="1" value="${p.abstand[0]}"><input type="number" id="e-ap" min="1" value="${p.abstand[1]}"></span></label>
      </div>
      <div class="monatsraster">
        <div></div>${MON_KURZ.map(m => `<div class="kal-mon">${m[0]}</div>`).join("")}
        ${TAETIGKEITEN.map(t => `<div class="kal-name">${t.name}</div>${MON_KURZ.map((m, i) => `<label class="mcheck" title="${t.name}: ${MONATE[i]}"><input type="checkbox" data-t="${t.feld}" data-m="${i + 1}" ${(p[t.feld] || []).includes(i + 1) ? "checked" : ""}><span style="--f:${t.farbe}"></span></label>`).join("")}`).join("")}
      </div>
      <label>Anbau in Kürze<textarea id="e-text" rows="3">${esc(p.anleitung || "")}</textarea></label>
      <div class="knopfreihe">
        <button class="knopf haupt" id="e-speichern">Speichern</button>
        ${alt ? `<button class="knopf gefahr" id="e-loeschen">Löschen</button>` : ""}
      </div>
    </div>`);
  $("#e-speichern").onclick = () => {
    const name = $("#e-name").value.trim();
    if (!name) { melden("Bitte einen Namen eingeben."); return; }
    const neu = alt || { id: "eigen-" + gid() };
    Object.assign(neu, {
      name, gruppe: $("#e-gruppe").value, familie: $("#e-familie").value, zehrer: $("#e-zehrer").value,
      abstand: [Math.max(1, +$("#e-ar").value || 30), Math.max(1, +$("#e-ap").value || 30)],
      anleitung: $("#e-text").value.trim(),
    });
    TAETIGKEITEN.forEach(t => { neu[t.feld] = $$(`[data-t="${t.feld}"]:checked`).map(c => +c.dataset.m); });
    D.eigenePflanzen = D.eigenePflanzen || [];
    if (!alt) D.eigenePflanzen.push(neu);
    speichern(); melden("Gespeichert.");
    location.hash = "wissen/pflanze/" + encodeURIComponent(neu.id);
  };
  if (alt) $("#e-loeschen").onclick = async () => {
    if (!await fragen({ titel: "Pflanze löschen?", text: `„${esc(alt.name)}“ wird aus deinem Lexikon entfernt.`, ja: "Löschen", gefahr: true })) return;
    D.eigenePflanzen = D.eigenePflanzen.filter(x => x.id !== alt.id);
    if (D.pflanzenNotizen) delete D.pflanzenNotizen[alt.id];
    speichern(); location.hash = "wissen";
  };
}

/* ---------- Startseite: Was steht diesen Monat an ---------- */
function monatKarteHTML() {
  if (!LEX_OK) return `<p class="leise">Pflanzendaten nicht geladen.</p>`;
  const mo = new Date().getMonth() + 1;
  const gruppen = monatsListen(mo).filter(t => t.pflanzen.length);
  if (!gruppen.length) return `<p class="leise">In diesem Monat steht laut Lexikon nichts an.</p>`;
  return gruppen.map(t => `<div class="kal-gruppe"><div class="kal-gruppe-titel"><i style="background:${t.farbe}"></i>${t.name}</div>
      ${t.pflanzen.slice(0, 8).map(p => `<a class="chip" href="#wissen/pflanze/${encodeURIComponent(p.id)}">${esc(p.name)}</a>`).join("")}${t.pflanzen.length > 8 ? `<a class="chip mehr" href="#wissen/kalender">+${t.pflanzen.length - 8}</a>` : ""}
    </div>`).join("") + `<a class="knopf text" href="#wissen/kalender" style="padding-left:0">Zum Kalender →</a>`;
}


function seitentitel(main, titel, unter) {
  main.insertAdjacentHTML("beforeend", `<div class="seitentitel"><h1>${esc(titel)}</h1>${unter ? `<p class="leise">${unter}</p>` : ""}</div>`);
}
function baldKarte(titel, punkte) {
  return `<div class="karte bald"><h2>🌱 ${esc(titel)}</h2>
    <p class="leise klein">Diese Funktionen kommen Schritt für Schritt in den nächsten Versionen:</p>
    <ul>${punkte.map(p => `<li>${p}</li>`).join("")}</ul></div>`;
}

  start(main) {

    main.insertAdjacentHTML("beforeend", `
      <p class="leise" style="margin-top:-6px" id="datum-gross">${WOCHENTAGE_LANG[heute.getDay()]}, ${datumText(heute)}</p>
      <div class="raster zwei">
        <div class="karte" id="wetter"></div>
        <div>
          <div class="karte">
            <h2>🗓️ Im ${MONATE[heute.getMonth()]}</h2>
            ${monatKarteHTML()}
          </div>
          <div class="karte">
            <h2>🥕 Im Garten</h2>
            ${(() => {
              const beete = D.garten.objekte.filter(o => ARTEN[o.art]?.pflanzbar);

        </div>

    wetterKarte($("#wetter"));
  },

  garten(main) { gartenSeite(main); },

  planung(main) {
    seitentitel(main, "Planung");
    main.insertAdjacentHTML("beforeend", `
      <div class="karte"><p>Hier planst du die nächste Saison auf demselben Gartenplan – im Planungsmodus, ohne deinen echten Garten zu verändern.</p></div>
      ${baldKarte("Geplant", [
        "Jahreszeiten, die aufeinander aufbauen: Frühling → Sommer → Herbst → Winter",

        "Druckansicht des Plans (als PDF speicherbar)",
      ])}`);
  },

  chronik(main) {
    seitentitel(main, "Chronik");
    main.insertAdjacentHTML("beforeend", `
      <div class="karte"><p>Die Chronik hält fest, was in deinem Garten passiert ist.</p></div>

/* ---------- Rückgängig ---------- */

  G.zurueck.push(vorher); if (G.zurueck.length > 60) G.zurueck.shift();
  G.vor = [];
  speichern();
}
function wiederherstellen(json) {
  const s = JSON.parse(json);
  D.garten.objekte = s.objekte; D.garten.bereiche = s.bereiche;

  speichern(); planZeichnen(); panelZeichnen(); leisteAktualisieren();

function rueckgaengig() { if (!G.zurueck.length) return; G.vor.push(stand()); wiederherstellen(G.zurueck.pop()); }

/* ---------- Ansicht ---------- */
function planGroesse() { const r = $("#plan").getBoundingClientRect(); return { b: r.width || 1, h: r.height || 1, l: r.left, o: r.top }; }

function massstab() { return planGroesse().b / G.view.w; } // Pixel pro cm
function welt(cx, cy) {
  const g = planGroesse();
  return [G.view.x + (cx - g.l) / g.b * G.view.w, G.view.y + (cy - g.o) / g.h * viewHoehe()];
}
function allesZeigen() {
  const ob = D.garten.objekte;
  if (!ob.length) { G.view = { x: -100, y: -100, w: 1400 }; planZeichnen(); return; }
  const rs = ob.map(rahmen);
  const x1 = Math.min(...rs.map(r => r.x1)), y1 = Math.min(...rs.map(r => r.y1));
  const x2 = Math.max(...rs.map(r => r.x2)), y2 = Math.max(...rs.map(r => r.y2));

  const vh = w * g.h / g.b;

  const g = planGroesse();

  const [wx, wy] = welt(cx, cy);
  const neuW = Math.min(Math.max(G.view.w * faktor, 40), 30000);
  const fx = (cx - g.l) / g.b, fy = (cy - g.o) / g.h;

/* ---------- Abstände zu den Nachbarn (gestrichelte Linien) ---------- */
function abstaende(o) {
  const r = rahmen(o), cx = (r.x1 + r.x2) / 2, cy = (r.y1 + r.y2) / 2;
  const kanten = [];
  for (const q of D.garten.objekte) {
    if (q.id === o.id || q.form === "linie") continue;
    const p = umriss(q);
    for (let i = 0; i < p.length; i++) kanten.push([p[i], p[(i + 1) % p.length]]);
  }
  const ergebnis = [];
  const richtungen = [
    { start: [r.x1, cy], achse: 0, vz: -1 }, { start: [r.x2, cy], achse: 0, vz: 1 },
    { start: [cx, r.y1], achse: 1, vz: -1 }, { start: [cx, r.y2], achse: 1, vz: 1 },
  ];
  for (const ri of richtungen) {
    let best = Infinity;
    const [sx, sy] = ri.start;
    for (const [a, b] of kanten) {
      if (ri.achse === 0) {             // waagerechter Strahl auf Höhe sy
        if ((a[1] > sy) === (b[1] > sy)) continue;
        const x = a[0] + (sy - a[1]) / (b[1] - a[1]) * (b[0] - a[0]), d = (x - sx) * ri.vz;
        if (d > 0.5 && d < best) best = d;
      } else {                          // senkrechter Strahl bei sx
        if ((a[0] > sx) === (b[0] > sx)) continue;
        const y = a[1] + (sx - a[0]) / (b[0] - a[0]) * (b[1] - a[1]), d = (y - sy) * ri.vz;
        if (d > 0.5 && d < best) best = d;
      }
    }
    if (best < Infinity) {
      const ende = ri.achse === 0 ? [sx + best * ri.vz, sy] : [sx, sy + best * ri.vz];
      ergebnis.push({ von: ri.start, bis: ende, laenge: best });
    }
  }
  return ergebnis;
}

/* ---------- Einrasten mit Hilfslinien ---------- */
function fangKandidaten(ausser) {   // x- und y-Werte aller Ecken (außer der gezogenen)
  const xs = [], ys = [];
  for (const q of D.garten.objekte) {
    if (ausser.id === q.id && ausser.ganz) continue;
    if (q.form === "kreis") { xs.push(q.x, q.x - q.r, q.x + q.r); ys.push(q.y, q.y - q.r, q.y + q.r); continue; }

/* ---------- Zeichnen ---------- */
function formElement(o, kl, s) {
  const id = `data-rolle="obj" data-id="${o.id}"`;
  if (o.form === "kreis") return `<circle class="${kl}" ${id} cx="${o.x}" cy="${o.y}" r="${o.r}"/>`;
  if (o.form === "linie") {
    const d = pfadD(o), gew = o.id === G.auswahl;
    return `<g ${id} class="pfad-gruppe"><path class="pfad-rand${gew ? " gewaehlt" : ""}" d="${d}" stroke-width="${o.breite + (gew ? 5 : 3) / s}"/><path class="pfad-innen" d="${d}" stroke-width="${o.breite}"/></g>`;
  }
  if (o.rund) return `<path class="${kl}" ${id} d="${pfadD(o)}"/>`;
  return `<polygon class="${kl}" ${id} points="${o.punkte.map(p => p.join(",")).join(" ")}"/>`;
}

function planZeichnen() {
  const svg = $("#plan"); if (!svg || !G.view) return;
  const vh = viewHoehe(), s = massstab(), v = G.view;
  svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${vh}`);
  const linie = 1 / s;
  const fein = [10, 50].find(r => r * s >= 7), grob = s * 100 >= 6 ? 100 : 1000;

    <pattern id="r-grob" width="${grob}" height="${grob}" patternUnits="userSpaceOnUse"><path d="M${grob} 0H0V${grob}" fill="none" stroke="var(--raster-stark)" stroke-width="${linie * 1.2}"/></pattern>
  </defs>
  ${fein ? `<rect x="${v.x}" y="${v.y}" width="${v.w}" height="${vh}" fill="url(#r-fein)"/>` : ""}
  <rect x="${v.x}" y="${v.y}" width="${v.w}" height="${vh}" fill="url(#r-grob)"/>`;

  const sortiert = [...D.garten.objekte].sort((a, b) => ARTEN[a.art].ebene - ARTEN[b.art].ebene);

    const hoeher = D.garten.objekte.filter(q => q !== o && ARTEN[q.art].ebene > ARTEN[o.art].ebene);

/* ---------- Objekte anlegen und ändern ---------- */
function neuerName(art) {

  if (a.ohneNummer && anzahl === 0) return basis;
  let n = anzahl + 1;
  while (D.garten.objekte.some(o => o.name === `${basis} ${n}`)) n++;

}
function hinzufuegen(art, masse) {
  const a = ARTEN[art], vorher = stand(), r = D.garten.raster || 10;
  const g = planGroesse();
  let [cx, cy] = welt(g.l + g.b / 2, g.o + g.h / 2);
  cx = einrasten(cx, r); cy = einrasten(cy, r);
  let o;
  if (a.kreis) o = { id: gid(), art, name: neuerName(art), form: "kreis", x: cx, y: cy, r: a.r };
  else if (a.linie) {
    const l = einrasten(Math.min(400, G.view.w / 4), r);
    o = { id: gid(), art, name: neuerName(art), form: "linie", breite: a.breite, rund: true, punkte: [[cx - l / 2, cy], [cx, cy], [cx + l / 2, cy]] };
  } else {
    const b = masse ? masse.b : a.b, t = masse ? masse.t : a.t;
    const x = masse ? 0 : einrasten(cx - b / 2, r), y = masse ? 0 : einrasten(cy - t / 2, r);
    o = { id: gid(), art, name: neuerName(art), form: "poly", punkte: [[x, y], [x + b, y], [x + b, y + t], [x, y + t]] };
  }
  D.garten.objekte.push(o);
  G.auswahl = o.id; G.ecke = null; G.bearbeiten = true;
  merken(vorher);
  if (masse) allesZeigen(); else planZeichnen();
  panelZeichnen(); leisteAktualisieren();
}

function loeschen(id) {

  G.auswahl = null; G.ecke = null;

function duplizieren(id) {

/* ============================================================
   SELBST ZEICHNEN
   Mit gedrückter Maustaste grob umfahren oder Ecken einzeln anklicken.
   Danach wird die Linie vereinfacht, begradigt und ins Raster gelegt.
   ============================================================ */
function zeichnenStarten(art) {
  G.zeichnen = { art, punkte: [], strich: null, maus: null, unten: null };
  G.auswahl = null; G.ecke = null; G.bearbeiten = true;
  zeichnenHinweis(); planZeichnen(); panelZeichnen(); leisteAktualisieren();
}
function zeichnenBeenden(abbrechen) {
  const z = G.zeichnen; G.zeichnen = null;
  zeichnenHinweis();
  if (abbrechen || !z) { planZeichnen(); panelZeichnen(); return; }
  const linie = ARTEN[z.art].linie;
  let p = z.punkte.filter((q, i, a) => i === 0 || abstand(q, a[i - 1]) > 1);
  if (!linie && p.length > 3 && abstand(p[0], p[p.length - 1]) < 30 / massstab()) p.pop();
  if (p.length < (linie ? 2 : 3)) { melden(linie ? "Zeichne mindestens zwei Punkte." : "Zeichne mindestens drei Ecken."); planZeichnen(); panelZeichnen(); return; }
  p = begradigen(begradigen(p, !linie), !linie);
  const r = D.garten.raster || 10;
  p = p.map(([x, y]) => [einrasten(x, r), einrasten(y, r)]).filter((q, i, a) => i === 0 || abstand(q, a[i - 1]) > 0);
  p = geradeZusammenfassen(p, !linie);
  const vorher = stand();
  const o = linie
    ? { id: gid(), art: z.art, name: neuerName(z.art), form: "linie", breite: ARTEN[z.art].breite, rund: true, punkte: p }
    : { id: gid(), art: z.art, name: neuerName(z.art), form: "poly", punkte: p };
  D.garten.objekte.push(o);
  G.auswahl = o.id;
  merken(vorher); if (z.art === "garten") allesZeigen(); else planZeichnen(); panelZeichnen(); leisteAktualisieren();
  melden(`„${o.name}“ gezeichnet. Jetzt kannst du Ecken ziehen, Maße eintippen oder Kanten biegen.`);

/* Fast waagerechte oder senkrechte Kanten gerade ausrichten (bis 7° Abweichung) */

    if (Math.abs(dy) <= Math.abs(dx) * grenze) { const y = (a[1] + b[1]) / 2; a[1] = y; b[1] = y; }
    else if (Math.abs(dx) <= Math.abs(dy) * grenze) { const x = (a[0] + b[0]) / 2; a[0] = x; b[0] = x; }
