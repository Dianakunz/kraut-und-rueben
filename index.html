function zeichnenHinweis() {
  const el = $("#zeichnen-leiste"); if (!el) return;
  const z = G.zeichnen;
  el.classList.toggle("verborgen", !z);
  if (!z) return;
  const linie = ARTEN[z.art].linie;
  el.innerHTML = `<div><b>✎ ${esc(ARTEN[z.art].name)} zeichnen</b><br><span class="klein">${linie
      ? "Mit gedrückter Maustaste den Weg entlangfahren oder Punkte einzeln anklicken."
      : "Mit gedrückter Maustaste grob umfahren oder die Ecken einzeln anklicken. Klick auf den ersten Punkt schließt die Form."}
      Doppelklick oder Enter = fertig, Esc = abbrechen. Mausrad zoomt.</span></div>
    <div class="knopfreihe" style="margin:0">
      <button class="knopf" data-z="zurueck" ${z.punkte.length ? "" : "disabled"}>↶ Letzter Punkt weg</button>
      <button class="knopf" data-z="abbrechen">Abbrechen</button>
      <button class="knopf haupt" data-z="fertig" ${z.punkte.length >= (linie ? 2 : 3) ? "" : "disabled"}>Fertig</button>
    </div>`;
  $$("[data-z]", el).forEach(k => k.onclick = () => {
    if (k.dataset.z === "zurueck") { z.punkte.pop(); zeichnenHinweis(); planZeichnen(); }
    if (k.dataset.z === "abbrechen") zeichnenBeenden(true);
    if (k.dataset.z === "fertig") zeichnenBeenden();
  });
}
function zeichnenHTML(s) {
  const z = G.zeichnen, linie = ARTEN[z.art].linie, p = z.punkte;
  let h = "";
  const alle = z.maus && !z.unten ? [...p, z.maus] : p;
  if (alle.length >= 2) h += `<path class="zeichnung" d="M${alle.map(q => q.join(" ")).join("L")}${!linie && alle.length >= 3 ? "Z" : ""}"/>`;
  if (z.strich && z.strich.length > 1) h += `<path class="zeichnung-strich" d="M${z.strich.map(q => q.join(" ")).join("L")}"/>`;
  // Länge der Kante, die gerade entsteht, und Außenmaße
  if (z.maus && p.length && !z.unten) {
    const a = p[p.length - 1], l = abstand(a, z.maus);
    if (l * s > 30) h += `<text class="kantenmass" x="${(a[0] + z.maus[0]) / 2}" y="${(a[1] + z.maus[1]) / 2 - 10 / s}" font-size="${12 / s}" text-anchor="middle">${m(l)}</text>`;
  }
  if (alle.length >= 2) {
    const xs = alle.map(q => q[0]), ys = alle.map(q => q[1]);
    const r = { x1: Math.min(...xs), x2: Math.max(...xs), y1: Math.min(...ys), y2: Math.max(...ys) };
    h += `<text class="aussenmass-text" x="${r.x2 + 10 / s}" y="${r.y2 + 16 / s}" font-size="${11.5 / s}">${m(r.x2 - r.x1)} × ${m(r.y2 - r.y1)}</text>`;
  }
  p.forEach((q, i) => { h += `<circle class="${i === 0 && !linie ? "zeichnung-start" : "zeichnung-punkt"}" cx="${q[0]}" cy="${q[1]}" r="${(i === 0 && !linie ? 8 : 4.5) / s}"/>`; });
  if (z.maus && !z.unten) h += `<circle class="zeichnung-punkt" cx="${z.maus[0]}" cy="${z.maus[1]}" r="${4 / s}" opacity=".6"/>`;
  return h;
}

/* ---------- Maus, Finger, Tastatur ---------- */
function planEreignisse() {
  const svg = $("#plan");
  svg.addEventListener("pointerdown", e => {
    G.zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    if (G.zeiger.size === 2) {           // zwei Finger: zoomen
      const [a, b] = [...G.zeiger.values()];
      if (G.zug && G.zug.vorher && G.zug.bewegt) wiederherstellen(G.zug.vorher);
      G.fuehrung = null;
      G.zug = { art: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y), view0: { ...G.view }, mitte: welt((a.x + b.x) / 2, (a.y + b.y) / 2) };
      return;
    }
    if (G.zeiger.size > 2) return;
    if (G.zeichnen) { zeichnenRunter(e); return; }
    const t = e.target.closest("[data-rolle]"), rolle = t && t.dataset.rolle;
    const w = welt(e.clientX, e.clientY), start = { x: e.clientX, y: e.clientY };
    const o = G.auswahl && objekt(G.auswahl), ed = editierbar(o);
    if (ed && rolle === "griff") {
      G.ecke = +t.dataset.i;
      G.zug = { art: "ecke", i: G.ecke, vorher: stand(), start, bewegt: false };
      planZeichnen(); panelZeichnen();
    } else if (ed && rolle === "neu") {
      const i = +t.dataset.i, r = rasterwert(e), vorher = stand(), mitte = abschnittMitte(o, i);
      o.punkte.splice(i + 1, 0, [einrasten(mitte[0], r), einrasten(mitte[1], r)]);
      rundEinfuegen(o, i + 1, i);
      G.ecke = i + 1;
      G.zug = { art: "ecke", i: i + 1, vorher, start, bewegt: true };
      planZeichnen();
    } else if (ed && rolle === "verlaengern") {
      const vorher = stand(), r = rasterwert(e), neu = [einrasten(w[0], r), einrasten(w[1], r)];
      if (t.dataset.ende === "0") { o.punkte.unshift(neu); rundEinfuegen(o, 0, 0); G.ecke = 0; }
      else { o.punkte.push(neu); rundEinfuegen(o, o.punkte.length - 2, o.punkte.length - 3); G.ecke = o.punkte.length - 1; }
      G.zug = { art: "ecke", i: G.ecke, vorher, start, bewegt: true };
      planZeichnen();
    } else if (ed && rolle === "drehen") {
      const mitte = schwerpunkt(o);
      G.zug = { art: "drehen", orig: kopie(o), mitte, winkel0: Math.atan2(w[1] - mitte[1], w[0] - mitte[0]), grad: 0, vorher: stand(), start, bewegt: false };
    } else if (ed && rolle === "radius") {
      G.zug = { art: "radius", vorher: stand(), start, bewegt: false };
    } else if (rolle === "obj" && ed && t.dataset.id === G.auswahl) {
      // Nur das bereits gewählte Objekt lässt sich verschieben
      G.zug = { art: "obj", id: o.id, w0: w, orig: kopie(o), vorher: stand(), start, bewegt: false };
    } else {
      G.zug = { art: "pan", start, view0: { ...G.view }, klickId: rolle === "obj" ? t.dataset.id : null, bewegt: false };
    }
    svg.classList.add("ziehen");
  });

  svg.addEventListener("pointermove", e => {
    if (G.zeichnen && G.zeiger.size < 2) { zeichnenBewegen(e); return; }
    if (!G.zeiger.has(e.pointerId)) return;
    G.zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const z = G.zug; if (!z) return;
    if (z.art === "pinch") {
      const [a, b] = [...G.zeiger.values()]; if (!b) return;
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, g = planGroesse();
      const neuW = Math.min(Math.max(z.view0.w * z.d0 / d, 40), 30000);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const fx = (mx - g.l) / g.b, fy = (my - g.o) / g.h;
      G.view = { x: z.mitte[0] - fx * neuW, y: z.mitte[1] - fy * neuW * g.h / g.b, w: neuW };
      planZeichnen(); return;
    }
    if (!z.bewegt && Math.hypot(e.clientX - z.start.x, e.clientY - z.start.y) < 4) return;
    z.bewegt = true;
    const w = welt(e.clientX, e.clientY);
    if (z.art === "pan") {
      const s = massstab();
      G.view = { ...z.view0, x: z.view0.x - (e.clientX - z.start.x) / s, y: z.view0.y - (e.clientY - z.start.y) / s };
      planZeichnen();
    } else if (z.art === "obj") {
      const o = objekt(z.id), [dx, dy] = verschiebungFangen(z, w, e);
      if (o.form === "kreis") { o.x = z.orig.x + dx; o.y = z.orig.y + dy; }
      else o.punkte = z.orig.punkte.map(([x, y]) => [x + dx, y + dy]);
      planZeichnen();
    } else if (z.art === "ecke") {
      const o = objekt(G.auswahl); o.punkte[z.i] = eckeFangen(o, z.i, w, e);
      planZeichnen();
    } else if (z.art === "drehen") {
      const o = objekt(G.auswahl), grad = drehFangen(z, w, e), rad = grad * Math.PI / 180, c = Math.cos(rad), sn = Math.sin(rad), [mx, my] = z.mitte;
      z.grad = ((grad % 360) + 540) % 360 - 180;
      o.punkte = z.orig.punkte.map(([x, y]) => [Math.round((mx + (x - mx) * c - (y - my) * sn) * 10) / 10, Math.round((my + (x - mx) * sn + (y - my) * c) * 10) / 10]);
      planZeichnen();
    } else if (z.art === "radius") {
      const o = objekt(G.auswahl); o.r = Math.max(5, einrasten(Math.hypot(w[0] - o.x, w[1] - o.y), Math.min(rasterwert(e), 5)));
      planZeichnen();
    }
  });

  const ende = e => {
    G.zeiger.delete(e.pointerId);
    if (G.zeichnen && (!G.zug || G.zug.art !== "pinch")) { zeichnenHoch(e); return; }
    const z = G.zug; if (!z) return;
    if (z.art === "pinch") { if (G.zeiger.size === 0) G.zug = null; return; }
    G.zug = null; G.fuehrung = null; G.kantenFang = null; svg.classList.remove("ziehen");
    if (z.art === "ecke" && !z.bewegt) {
      const jetzt = Date.now(), l = G.letzteEcke;
      G.letzteEcke = { t: jetzt, i: z.i, id: G.auswahl };
      if (l && l.id === G.auswahl && l.i === z.i && jetzt - l.t < 400) { G.letzteEcke = null; eckeEntfernen(G.auswahl, z.i); leisteAktualisieren(); return; }
    }
    if (z.art === "pan" && !z.bewegt) waehlen(z.klickId);
    else { if (z.vorher) { merken(z.vorher); panelZeichnen(); } planZeichnen(); }
    leisteAktualisieren();
  };
  svg.addEventListener("pointerup", ende);
  svg.addEventListener("pointercancel", ende);

  svg.addEventListener("dblclick", e => {
    if (G.zeichnen) { zeichnenBeenden(); return; }
    const t = e.target.closest('[data-rolle="griff"]');
    if (t && editierbar(objekt(G.auswahl))) eckeEntfernen(G.auswahl, +t.dataset.i);
  });

  svg.addEventListener("wheel", e => {
    e.preventDefault();
    zoomen(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
  }, { passive: false });
}

function gartenTasten(e) {
  if (aktuelleSeite() !== "garten" || $("#dialog").open) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (G.zeichnen) {
    if (e.key === "Enter") { e.preventDefault(); zeichnenBeenden(); }
    else if (e.key === "Escape") zeichnenBeenden(true);
    else if (e.key === "Backspace" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z")) { e.preventDefault(); G.zeichnen.punkte.pop(); zeichnenHinweis(); planZeichnen(); }
    return;
  }
  const strg = e.ctrlKey || e.metaKey;
  if (strg && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? wiederholen() : rueckgaengig(); return; }
  if (strg && e.key.toLowerCase() === "y") { e.preventDefault(); wiederholen(); return; }
  if (e.key === "Escape") { waehlen(null); return; }
  const o = G.auswahl && objekt(G.auswahl);
  if (!editierbar(o)) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    e.preventDefault();
    if (G.ecke !== null) eckeEntfernen(o.id, G.ecke); else loeschen(o.id);
    return;
  }
  const schritte = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (schritte) {
    e.preventDefault();
    const d = (D.garten.raster || 10) * (e.shiftKey ? 10 : 1), vorher = stand();
    verschieben(o.id, schritte[0] * d, schritte[1] * d);
    merken(vorher); planZeichnen();
  }
}
document.addEventListener("keydown", gartenTasten);

/* ---------- Seitenleiste (Panel) ---------- */
function groesseText(o) {
  const r = rahmen(o), fl = flaeche(o) / 10000;
  if (o.form === "kreis") return `Ø ${m(o.r * 2)} · ${zahl(fl, 2)} m²`;
  if (o.form === "linie") return `${m(laengeLinie(umriss(o)))} lang, ${m(o.breite)} breit`;
  if (istRechteckGedreht(o) && !istRechteck(o)) return `${m(abstand(o.punkte[0], o.punkte[1]))} × ${m(abstand(o.punkte[1], o.punkte[2]))} · ${zahl(fl, fl < 10 ? 2 : 1)} m²`;
  return (istRechteck(o) ? `${m(r.x2 - r.x1)} × ${m(r.y2 - r.y1)} · ` : "") + `${zahl(fl, fl < 10 ? 2 : 1)} m²`;
}

  } else {

      <label>Form-Vorlage</label>

  if (form !== "kreis") h += `<label class="schalter"><input type="checkbox" data-feld="rund" ${o.rund === true ? "checked" : ""}> ${form === "linie" ? "Geschwungen" : "Alle Kanten geschwungen"}</label>`;

      ${form === "kreis" ? "" : `<button class="knopf" data-tun="drehen90">↻ 90° drehen</button><button class="knopf" data-tun="drehen">Drehen um …</button>`}
      <button class="knopf" data-tun="duplizieren">⧉ Duplizieren</button>
      <button class="knopf gefahr" data-tun="loeschen">🗑️ Löschen</button>
    </div></div>
    <p class="klein leise">${form === "kreis" ? "Ziehen verschiebt den Kreis, der Punkt rechts ändert die Größe." :
      form === "linie" ? "Punkte ziehen formt den Weg. Das Plus zwischen zwei Punkten fügt einen Punkt ein, das Plus an den Enden verlängert den Weg." :
      "Ziehen verschiebt die Fläche, der runde Griff ↻ darüber dreht sie (rastet parallel zu nahen Kanten ein). Ecken ziehen ändert die Form, das Plus auf einer Kante fügt eine Ecke ein, Doppelklick auf eine Ecke entfernt sie."}
      Blau gestrichelt: Abstand zur nächsten Kante. Ecken rasten an anderen Ecken ein (rote Hilfslinie). Umschalttaste = frei, ohne Einrasten.</p>`;
  el.innerHTML = h;
  const cb = $('[data-feld="rund"]', el); if (cb && Array.isArray(o.rund)) cb.indeterminate = true;
  panelEreignisse(el, o);
}

/* Breite/Tiefe einer beliebigen Fläche ändern (proportional). Eine gerade Kante am Rand bleibt stehen. */
function skalieren(o, neuB, neuT) {
  const r = rahmen(o), b = r.x2 - r.x1 || 1, t = r.y2 - r.y1 || 1;
  const fx = neuB ? neuB / b : 1, fy = neuT ? neuT / t : 1;
  const tl = teile(o), nah = (a, c) => Math.abs(a - c) < 0.5;
  const amRand = test => tl.some(k => !k.bez && test(k.a) && test(k.b));
  const ax = amRand(q => nah(q[0], r.x2)) && !amRand(q => nah(q[0], r.x1)) ? r.x2 : r.x1;
  const ay = amRand(q => nah(q[1], r.y2)) && !amRand(q => nah(q[1], r.y1)) ? r.y2 : r.y1;
  o.punkte = o.punkte.map(([x, y]) => [Math.round(ax + (x - ax) * fx), Math.round(ay + (y - ay) * fy)]);
}

/* Fertige Formen, die Breite und Tiefe der bisherigen Fläche übernehmen */
function bogenPunkte(cx, cy, rx, ry, von, bis, schritte) {
  return Array.from({ length: schritte + 1 }, (_, k) => {
    const w = (von + (bis - von) * k / schritte) * Math.PI / 180;
    return [Math.round(cx + rx * Math.cos(w)), Math.round(cy + ry * Math.sin(w))];
  });
}
function formVorlage(o, art, seite) {
  const r = rahmen(o), x1 = Math.round(r.x1), y1 = Math.round(r.y1), x2 = Math.round(r.x2), y2 = Math.round(r.y2);
  const w = x2 - x1, h = y2 - y1, cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
  let p, rund;
  if (art === "rechteck") { p = [[x1, y1], [x2, y1], [x2, y2], [x1, y2]]; rund = [false, false, false, false]; }
  else if (art === "oval") { p = bogenPunkte(cx, cy, w / 2, h / 2, 0, 315, 7); rund = p.map(() => true); }
  else if (art === "abgerundet") {
    const k = Math.round(Math.min(w, h) * 0.2);
    p = [...bogenPunkte(x2 - k, y1 + k, k, k, 270, 360, 2), ...bogenPunkte(x2 - k, y2 - k, k, k, 0, 90, 2),
         ...bogenPunkte(x1 + k, y2 - k, k, k, 90, 180, 2), ...bogenPunkte(x1 + k, y1 + k, k, k, 180, 270, 2)];
    rund = [true, true, false, true, true, false, true, true, false, true, true, false];
  } else if (art === "halbrund") {
    const b = { rechts: [x2, cy, w, h / 2, 270, 90], links: [x1, cy, w, h / 2, -90, 90],
                oben: [cx, y1, w / 2, h, 0, 180], unten: [cx, y2, w / 2, h, 180, 360] }[seite];
    p = bogenPunkte(b[0], b[1], b[2], b[3], b[4], b[5], 6);
    rund = [...p.slice(1).map(() => true), false];
  }
  if (!p) return;
  o.punkte = p; rundSetzen(o, rund); G.ecke = null;
}

function panelEreignisse(el, o) {
  const aendern = fn => { const vorher = stand(); fn(); merken(vorher); planZeichnen(); panelZeichnen(); leisteAktualisieren(); };
  $$("[data-feld]", el).forEach(f => f.addEventListener("change", () => {
    const wert = f.value, zahlwert = parseFloat(String(wert).replace(",", "."));
    aendern(() => {
      const feld = f.dataset.feld;
      if (feld === "name") o.name = wert.trim() || o.name;
      else if (feld === "art") o.art = wert;
      else if (feld === "rund") { if (f.checked) o.rund = true; else delete o.rund; }
      else if (feld === "durchmesser" && zahlwert > 0) o.r = Math.round(zahlwert * 50);
      else if (feld === "wegbreite" && zahlwert > 0) o.breite = Math.round(zahlwert * 100);
      else if (feld === "seiteA" && zahlwert > 0) seitenSetzen(o, zahlwert * 100, abstand(o.punkte[1], o.punkte[2]));
      else if (feld === "seiteB" && zahlwert > 0) seitenSetzen(o, abstand(o.punkte[0], o.punkte[1]), zahlwert * 100);
      else if ((feld === "breite" || feld === "tiefe") && zahlwert > 0) {
        if (istRechteck(o)) {
          const r = rahmen(o);
          const b = feld === "breite" ? Math.round(zahlwert * 100) : r.x2 - r.x1;
          const t = feld === "tiefe" ? Math.round(zahlwert * 100) : r.y2 - r.y1;
          o.punkte = [[r.x1, r.y1], [r.x1 + b, r.y1], [r.x1 + b, r.y1 + t], [r.x1, r.y1 + t]];
        } else skalieren(o, feld === "breite" ? zahlwert * 100 : null, feld === "tiefe" ? zahlwert * 100 : null);
      }
    });
  }));
  $$("[data-vorlage]", el).forEach(k => k.onclick = () => aendern(() => formVorlage(o, k.dataset.vorlage)));
  const hb = $("[data-vorlage-halbrund]", el);
  if (hb) hb.onchange = () => { if (hb.value) aendern(() => formVorlage(o, "halbrund", hb.value)); };
  $$("[data-kante-rund]", el).forEach(k => k.onclick = () => {
    const i = +k.dataset.kanteRund; G.kantenOffen = true;
    aendern(() => { const l = rundListe(o); l[i] = !l[i]; rundSetzen(o, l); });
  });
  $$("[data-kante-zeile]", el).forEach(z => {
    const an = () => { G.kanteHervor = +z.dataset.kanteZeile; planZeichnen(); };
    const aus = () => { G.kanteHervor = null; planZeichnen(); };
    z.addEventListener("mouseenter", an); z.addEventListener("mouseleave", aus);
    z.addEventListener("focusin", an); z.addEventListener("focusout", aus);
  });
  const det = $("#kanten-details", el); if (det) det.addEventListener("toggle", () => { G.kantenOffen = det.open; });
  $$("[data-kante]", el).forEach(f => f.addEventListener("change", () => {
    const l = parseFloat(String(f.value).replace(",", ".")); if (!(l > 0)) return;
    const i = +f.dataset.kante, n = o.punkte.length, a = o.punkte[i], b = o.punkte[(i + 1) % n], alt = abstand(a, b) || 1;
    aendern(() => { o.punkte[(i + 1) % n] = [Math.round(a[0] + (b[0] - a[0]) / alt * l * 100), Math.round(a[1] + (b[1] - a[1]) / alt * l * 100)]; });
  }));
  $$("[data-tun]", el).forEach(k => k.onclick = async () => {
    const t = k.dataset.tun;
    if (t === "bearbeiten") { G.bearbeiten = true; planZeichnen(); panelZeichnen(); leisteAktualisieren(); }
    if (t === "fixieren") festSetzen(o.id, true);
    if (t === "loesen") { festSetzen(o.id, false); if (!G.bearbeiten) { G.bearbeiten = true; planZeichnen(); panelZeichnen(); leisteAktualisieren(); } }
    if (t === "loeschen") loeschen(o.id);
    if (t === "duplizieren") duplizieren(o.id);
    if (t === "drehen90") drehen(o.id, 90);
    if (t === "ecke-weg") eckeEntfernen(o.id, G.ecke);
    if (t === "drehen") {
      const w = await eingabe({ titel: "Drehen", text: "Um wie viel Grad soll die Fläche im Uhrzeigersinn gedreht werden? Minus dreht andersherum.", felder: [{ id: "grad", label: "Winkel", typ: "number", wert: 15, schritt: 1, einheit: "°" }], ja: "Drehen" });
      if (w && w.grad) drehen(o.id, w.grad);
    }
  });
}

function sicherungHerunterladen() {
  const inhalt = JSON.stringify({ app: "kraut-und-rueben", version: APP_VERSION, gesichert: new Date().toISOString(), daten: D }, null, 2);
  const blob = new Blob([inhalt], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `kraut-und-rueben-sicherung-${heuteISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  melden("Sicherung heruntergeladen.");
}

async function sicherungLaden(datei) {
  if (!datei) return;
  try {
    const j = JSON.parse(await datei.text());
    const daten = j.app === "kraut-und-rueben" ? j.daten : null;
    if (!daten || typeof daten !== "object" || !daten.schema) throw new Error("Das ist keine Sicherung von Kraut und Rüben.");
    const ok = await fragen({ titel: "Sicherung laden?", text: `Sicherung vom ${zeitText(j.gesichert)}. Deine aktuellen Daten auf diesem Gerät werden dadurch ersetzt.`, ja: "Laden" });
    if (!ok) return;
    D = ergaenzen(daten);
    D.einstellungen.willkommenGesehen = true;
    speichern();
    designAnwenden();
    zeigen();
    melden("Sicherung geladen.");
  } catch (e) {
    fragen({ titel: "Laden nicht möglich", text: esc(e.message), ja: "OK", nein: null });
  } finally {
    const f = $("#datei"); if (f) f.value = "";
  }
}

/* ============================================================
   OFFLINE-FÄHIGKEIT & UPDATES
   ============================================================ */
function serviceWorkerStarten() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const neu = reg.installing;
      neu && neu.addEventListener("statechange", () => {
        if (neu.state === "installed" && navigator.serviceWorker.controller) {
          melden("Eine neue Version ist da.", { text: "Aktualisieren", tun: () => neu.postMessage("jetzt-aktivieren") });
        }
      });
    });
  }).catch(e => console.warn("Service Worker:", e));
  // Nur neu laden, wenn eine ältere Version durch eine neue ersetzt wurde (nicht beim allerersten Besuch)
  const hatteVersion = !!navigator.serviceWorker.controller;
  let neuGeladen = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hatteVersion || neuGeladen) return; neuGeladen = true; location.reload();
  });
}
