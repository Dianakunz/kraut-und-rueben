<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraut und Rüben</title>
<meta name="description" content="Kraut und Rüben – dein Gartenplaner: geplant, gepflanzt, geerntet.">
<meta name="theme-color" content="#1f4d1a">
<!-- Vorschau beim Teilen des Links (WhatsApp, Signal, E-Mail …) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kraut und Rüben">
<meta property="og:title" content="Kraut und Rüben – dein Gartenplaner">
<meta property="og:description" content="Geplant, gepflanzt, geerntet: Garten zeichnen, Pflanzen setzen und ernten, Saison planen – mit Wetter- und Frostwarnungen.">
<meta property="og:url" content="https://dianakunz.github.io/kraut-und-rueben/">
<meta property="og:image" content="https://dianakunz.github.io/kraut-und-rueben/bilder/vorschau.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo von Kraut und Rüben: eine Rübe in der Erde">
<meta property="og:locale" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="bilder/favicon.png">
<link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
<style>
/* ============================================================
   FARBEN & GRUNDLAGEN
   Die Farben stammen aus dem Logo: Blattgrün, Schriftgrün,
   Rübenrot, Erdbraun und ein heller Cremeton.
   ============================================================ */
:root{
  --bg:#f7f4ea; --karte:#fffdf7; --karte2:#f1ecdd; --linie:#e2dac6;
  --text:#25301f; --leise:#6b6f5e;
  --gruen:#3f8a2a; --gruen-dunkel:#1f4d1a; --gruen-hell:#e3efd3; --blatt:#8cc63f;
  --rot:#c8234a; --rot-hell:#fbe3e8; --erde:#5a3418; --erde-hell:#efe2d3;
  --blau:#2f6f9f; --blau-hell:#e1edf6; --gelb:#b7791f; --gelb-hell:#fbefd6;
  --schatten:0 1px 2px rgba(60,50,20,.06),0 4px 14px rgba(60,50,20,.06);
  --radius:14px;
  --marke:var(--gruen-dunkel);
}
[data-theme="dark"]{
  --bg:#141812; --karte:#1d2219; --karte2:#252b20; --linie:#333b2c;
  --text:#e8eadf; --leise:#a3a895;
  --gruen:#7cc25a; --gruen-dunkel:#a6d98a; --gruen-hell:#26361f; --blatt:#8cc63f;
  --rot:#ef6a8b; --rot-hell:#3d1e26; --erde:#c9a07e; --erde-hell:#33281f;
  --blau:#7fb5df; --blau-hell:#1d2c38; --gelb:#e2b25c; --gelb-hell:#3a2f1a;
  --schatten:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --marke:#a6d98a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.5rem;color:var(--gruen-dunkel)}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0 0 .75em}
a{color:var(--gruen)}
button{font:inherit;color:inherit}
.verborgen{display:none!important}
svg.icon{width:24px;height:24px;flex:none}

/* ============================================================
   AUFBAU: Handy (Standard) und Laptop (ab 900 px Breite)
   ============================================================ */
#kopf{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bg); border-bottom:1px solid var(--linie);
}
.marke{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--marke);min-width:0}
.marke img{height:38px;width:auto}
.marke svg.wortmarke{height:34px;width:auto}
.version{font-size:.72rem;color:var(--leise);white-space:nowrap;align-self:flex-end;margin-bottom:2px}
.kopf-knoepfe{margin-left:auto;display:flex;gap:4px}
.rund{
  width:42px;height:42px;border-radius:50%;border:0;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--gruen-dunkel);
}
.rund:hover{background:var(--karte2)}
.rund.aktiv{background:var(--gruen-hell)}

#seitenleiste{display:none}

#leiste{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--karte);border-top:1px solid var(--linie);
  padding-bottom:env(safe-area-inset-bottom);
}
#leiste a{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 0 6px;text-decoration:none;color:var(--leise);font-size:.7rem;
}
#leiste a.aktiv{color:var(--gruen-dunkel);font-weight:600}
#leiste a.aktiv svg{color:var(--gruen)}

main{padding:16px 14px calc(90px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.seitenkopf{display:none}

@media (min-width:900px){
  body{display:grid;grid-template-columns:250px 1fr;min-height:100vh;
    background:linear-gradient(to right,var(--karte) 249px,var(--linie) 249px,var(--linie) 250px,var(--bg) 250px)}
  #kopf,#leiste{display:none}
  #seitenleiste{
    display:flex;flex-direction:column;gap:4px;
    position:sticky;top:0;height:100vh;padding:20px 14px;
    background:transparent;
  }
  #seitenleiste .marke{flex-direction:column;align-items:flex-start;gap:6px;margin:0 8px 18px}
  #seitenleiste .marke .zeile{display:flex;align-items:center;gap:8px}
  #seitenleiste .marke img{height:58px}
  #seitenleiste .marke svg.wortmarke{height:48px}
  #seitenleiste nav a{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
    text-decoration:none;color:var(--text);font-weight:500;
  }
  #seitenleiste nav a:hover{background:var(--karte2)}
  #seitenleiste nav a.aktiv{background:var(--gruen-hell);color:var(--gruen-dunkel);font-weight:650}
  #seitenleiste nav a.aktiv svg{color:var(--gruen)}
  #seitenleiste .fuss{margin-top:auto;font-size:.75rem;color:var(--leise);padding:0 10px}
  .rechts{min-width:0}
  .seitenkopf{
    display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;
    background:var(--bg);padding:16px 28px 12px;border-bottom:1px solid var(--linie);
  }
  .seitenkopf h1{margin:0}
  main{padding:24px 28px 48px}
  main > .seitentitel{display:none}
}

/* ============================================================
   BAUSTEINE
   ============================================================ */
.karte{
  background:var(--karte);border:1px solid var(--linie);border-radius:var(--radius);
  box-shadow:var(--schatten);padding:16px;margin-bottom:14px;
}
.karte > h2{display:flex;align-items:center;gap:8px}
.raster{display:grid;gap:14px}
@media (min-width:900px){ .raster.zwei{grid-template-columns:1.3fr 1fr;align-items:start} }
.leise{color:var(--leise)}
.klein{font-size:.85rem}
.knopf{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid var(--linie);
  background:var(--karte);cursor:pointer;font-weight:550;text-decoration:none;color:var(--text);
}
.knopf:hover{background:var(--karte2)}
.knopf.haupt{background:var(--gruen-dunkel);border-color:var(--gruen-dunkel);color:#fff}
[data-theme="dark"] .knopf.haupt{background:#4f8f35;border-color:#4f8f35}
.knopf.haupt:hover{filter:brightness(1.1)}
.knopf.gefahr{color:var(--rot);border-color:var(--rot)}
.knopf.gefahr.voll{background:var(--rot);color:#fff}
.knopf.text{border-color:transparent;background:transparent;color:var(--gruen)}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=text],input[type=search]{
  width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--linie);
  background:var(--karte);color:var(--text);font:inherit;
}
input:focus,.knopf:focus-visible,.rund:focus-visible,a:focus-visible{outline:2px solid var(--gruen);outline-offset:2px}
.suchzeile{display:flex;gap:8px;max-width:560px}
.suchzeile input{flex:1}
.liste{list-style:none;margin:8px 0 0;padding:0}
.liste li button{
  width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--linie);
  background:transparent;cursor:pointer;
}
.liste li button:hover{background:var(--karte2)}
.umschalter{display:inline-flex;border:1px solid var(--linie);border-radius:10px;overflow:hidden}
.umschalter button{border:0;background:var(--karte);padding:9px 14px;cursor:pointer}
.umschalter button+button{border-left:1px solid var(--linie)}
.umschalter button.an{background:var(--gruen-hell);color:var(--gruen-dunkel);font-weight:650}
.hinweis{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin:8px 0 0}
.hinweis .sym{font-size:1.2rem;line-height:1.3}
.hinweis.frost{background:var(--blau-hell)}
.hinweis.warn{background:var(--gelb-hell)}
.hinweis.hitze{background:var(--rot-hell)}
.hinweis.ok{background:var(--gruen-hell)}
.hinweis b{display:block}
.marker{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--erde-hell);color:var(--erde);font-weight:600}

/* Wetter */
.wettertage{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.tag{text-align:center;padding:8px 2px;border-radius:10px;background:var(--karte2);font-size:.8rem}
.tag.heute{background:var(--gruen-hell)}
.tag .wt{font-weight:650}
.tag .sym{font-size:1.35rem;line-height:1.6}
.tag .max{font-weight:650}
.tag .min{color:var(--leise)}
.tag .min.frost{color:var(--blau);font-weight:650}
.tag .regen{color:var(--blau);font-size:.72rem;min-height:1.1em;white-space:nowrap}
.raster > div{display:grid;gap:14px;align-content:start}
.raster .karte{margin-bottom:0}
.raster{margin-bottom:14px}

/* Geplante Funktionen */
.bald{border-style:dashed;background:transparent;box-shadow:none}
.bald ul{margin:6px 0 0;padding-left:20px}
.bald li{margin:3px 0}

/* Dialog-Eingaben */
.felder label{display:block;margin:0 0 10px;font-weight:550}
.feld-einheit{display:flex;align-items:center;gap:8px;margin-top:4px}
.feld-einheit input{flex:1}
input[type=number],select{
  min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--linie);
  background:var(--karte);color:var(--text);font:inherit;width:100%;
}

/* ============ GARTENPLAN ============ */
:root{
  --f-garten:#e6f1d3; --s-garten:#8cc63f;
  --f-rasen:#c9e4a0;  --s-rasen:#7fb13d;
  --f-weg:#e7dfd0;    --s-weg:#b3a58c;
  --f-terrasse:#ddd3c3; --s-terrasse:#9c8c72;
  --f-haus:#d8d0c4;   --s-haus:#7d6f5d;
  --f-sonstiges:#e3dbd0; --s-sonstiges:#8f8170;
  --f-beet:#b98a63;   --s-beet:#5a3418;
  --f-hochbeet:#94643d; --s-hochbeet:#4a2a12;
  --f-gewaechshaus:#d4eaf4; --s-gewaechshaus:#2f6f9f;
  --f-kuebel:#c27a45; --s-kuebel:#6b3a17;
  --plan-bg:#fbfaf4; --raster:#e4e0d2; --raster-stark:#d2ccb9; --auswahl:#c8234a;
  --beschriftung:#25301f;
}
[data-theme="dark"]{
  --f-garten:#26331d; --s-garten:#6fa33a;
  --f-rasen:#2f4721;  --s-rasen:#6fa33a;
  --f-weg:#3a352c;    --s-weg:#7d715d;
  --f-terrasse:#3b352d; --s-terrasse:#86775f;
  --f-haus:#3a3631;   --s-haus:#a4967f;
  --f-sonstiges:#36322c; --s-sonstiges:#998b76;
  --f-beet:#5b4129;   --s-beet:#c9a07e;
  --f-hochbeet:#4b3220; --s-hochbeet:#d2a57e;
  --f-gewaechshaus:#1f3a4a; --s-gewaechshaus:#7fb5df;
  --f-kuebel:#5e3a20; --s-kuebel:#e0a070;
  --plan-bg:#161b14; --raster:#232a1f; --raster-stark:#2f382a; --auswahl:#ef6a8b;
  --beschriftung:#e8eadf;
}
.plan-leiste{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.plan-leiste .knopf{min-height:38px;padding:6px 12px}
.plan-leiste .knopf.an{background:var(--gruen-hell);border-color:var(--gruen);color:var(--gruen-dunkel)}
@media (max-width:600px){
  .plan-leiste{gap:5px}
  .plan-leiste .lang{display:none}
  .plan-leiste .knopf{padding:6px 10px;min-width:40px}
  .plan-leiste .trenner{display:none}
  .plan-leiste select{max-width:130px}
  .menue-liste{position:fixed;left:12px;right:12px;top:auto;min-width:0}
}
.plan-leiste .trenner{width:1px;height:26px;background:var(--linie);margin:0 2px}
.plan-leiste select{width:auto;min-height:38px}
.knopf:disabled{opacity:.4;cursor:default}
.menue{position:relative}
.menue > summary{list-style:none}
.menue > summary::-webkit-details-marker{display:none}
.menue-liste{
  position:absolute;z-index:15;top:calc(100% + 4px);left:0;min-width:220px;
  background:var(--karte);border:1px solid var(--linie);border-radius:12px;box-shadow:var(--schatten);padding:6px;
}
.menue-liste button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer}
.menue-liste button:hover{background:var(--karte2)}
.farbpunkt{width:16px;height:16px;border-radius:4px;border:2px solid;flex:none}
.farbpunkt.rund{border-radius:50%}
.farbpunkt.linie{height:9px;border-radius:6px}
.panel label.schalter{display:flex;align-items:center;gap:8px;color:var(--text);font-size:.9rem;margin-top:12px;cursor:pointer}
.panel label.schalter input{width:18px;height:18px;accent-color:var(--gruen)}
.garten-layout{display:grid;gap:14px}
@media (min-width:900px){ .garten-layout{grid-template-columns:minmax(0,1fr) 320px;align-items:start} }
.plan-rahmen{
  position:relative;border:1px solid var(--linie);border-radius:var(--radius);overflow:hidden;
  background:var(--plan-bg);height:62vh;min-height:340px;
}
@media (min-width:900px){ .plan-rahmen{height:calc(100vh - 210px);min-height:460px} }
#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#plan.ziehen{cursor:grabbing}
.massstab{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--leise);pointer-events:none}
.massstab div{height:6px;border:2px solid var(--leise);border-top:0;margin-bottom:2px}
.plan-hinweis{position:absolute;right:10px;bottom:8px;font-size:.75rem;color:var(--leise);pointer-events:none;text-align:right}
#plan .obj{stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:pointer}
#plan .obj.gewaehlt{stroke:var(--auswahl);stroke-width:2.5px}
#plan .art-haus{stroke-width:2px}
#plan .art-garten{fill:var(--f-garten);stroke:var(--s-garten)}
#plan .art-rasen{fill:var(--f-rasen);stroke:var(--s-rasen)}
#plan .art-weg{fill:var(--f-weg);stroke:var(--s-weg)}
#plan .art-terrasse{fill:var(--f-terrasse);stroke:var(--s-terrasse)}
#plan .art-haus{fill:var(--f-haus);stroke:var(--s-haus)}
#plan .art-sonstiges{fill:var(--f-sonstiges);stroke:var(--s-sonstiges)}
#plan .art-beet{fill:var(--f-beet);stroke:var(--s-beet)}
#plan .art-hochbeet{fill:var(--f-hochbeet);stroke:var(--s-hochbeet)}
#plan .art-gewaechshaus{fill:var(--f-gewaechshaus);stroke:var(--s-gewaechshaus)}
#plan .art-kuebel{fill:var(--f-kuebel);stroke:var(--s-kuebel)}
#plan .pfad-gruppe{cursor:pointer}
#plan .pfad-rand{fill:none;stroke:var(--s-weg);stroke-linecap:round;stroke-linejoin:round}
#plan .pfad-rand.gewaehlt{stroke:var(--auswahl)}
#plan .pfad-innen{fill:none;stroke:var(--f-weg);stroke-linecap:round;stroke-linejoin:round}
#plan .abstand{stroke:var(--blau);stroke-width:1.5px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .abstandsmass{fill:var(--blau);font-weight:650;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px;stroke-linejoin:round}
#plan .fuehrung{stroke:var(--auswahl);stroke-width:1px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.8}
#plan .rechtwinklig{fill:none;stroke:var(--auswahl);stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan .winkelmass{fill:var(--leise);font-weight:700;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px}
#plan .winkelmass.genau{fill:var(--auswahl)}
#plan .griff{fill:#fff;stroke:var(--auswahl);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:move}
#plan .griff.aktiv{fill:var(--auswahl)}
#plan .neu{fill:var(--auswahl);opacity:.55;cursor:copy}
#plan .neu:hover{opacity:1}
#plan .neu-plus{stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none}
#plan text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;pointer-events:none}
#plan .beschriftung{fill:var(--beschriftung);font-weight:600}
#plan .beschriftung.klein{font-weight:400;opacity:.75}
#plan .kantenmass{fill:var(--auswahl);font-weight:650;paint-order:stroke;stroke:var(--plan-bg);stroke-width:3px;stroke-linejoin:round}
.panel .karte{margin-bottom:12px}
.panel h2{font-size:1.05rem}
.panel label{display:block;font-size:.85rem;color:var(--leise);margin:8px 0 2px}
.panel .zwei{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .kanten{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.9rem}
.panel .kanten input{min-height:34px;padding:4px 8px}
.panel .knopfreihe .knopf{min-height:36px;padding:6px 12px;font-size:.92rem}
.objliste{list-style:none;margin:0;padding:0}
.objliste li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--linie);cursor:pointer}
.objliste li:hover{background:var(--karte2)}
.objliste li .leise{margin-left:auto;font-size:.8rem}
.objliste li .x{margin-left:6px;border:0;background:transparent;cursor:pointer;color:var(--leise);font-size:1rem;padding:2px 6px}

/* Anleitung */
.anleitung details{border-top:1px solid var(--linie);padding:10px 0}
.anleitung details:first-of-type{border-top:0}
.anleitung summary{cursor:pointer;font-weight:650;color:var(--gruen-dunkel)}
.anleitung details > div{padding-top:8px}

/* Willkommen */
#willkommen{
  position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
#willkommen .innen{max-width:460px;width:100%;text-align:center}
#willkommen .logo{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--marke);margin-bottom:6px}
#willkommen .logo img{height:120px}
#willkommen .logo svg{height:84px;width:auto}
#willkommen .unter{font-size:1.1rem;color:var(--erde);margin:0 0 22px;font-weight:550}
#willkommen .karte{text-align:left}

/* Dialog & Meldung */
dialog{
  border:0;border-radius:var(--radius);padding:20px;max-width:420px;width:calc(100% - 32px);
  background:var(--karte);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(20,24,18,.45)}
dialog .knopfreihe{justify-content:flex-end}
#meldung{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:60;background:var(--gruen-dunkel);color:#fff;padding:10px 16px;border-radius:10px;
  box-shadow:var(--schatten);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;
}
[data-theme="dark"] #meldung{background:#3d6e2a}
#meldung button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
@media (min-width:900px){ #meldung{bottom:24px} }
@media print{ #kopf,#leiste,#seitenleiste,.seitenkopf .kopf-knoepfe{display:none!important} body{display:block} }
</style>

      <button class="rund" data-ziel="anleitung" aria-label="Anleitung"><svg class="icon"><use href="#i-hilfe"/></svg></button>
      <button class="rund" data-ziel="einstellungen" aria-label="Einstellungen"><svg class="icon"><use href="#i-zahnrad"/></svg></button>
    </div>
  </header>

  <!-- Laptop: Seitentitel mit Knöpfen -->
  <div class="seitenkopf">
    <h1 id="seitentitel-gross"></h1>
    <div class="kopf-knoepfe">
      <button class="rund" data-ziel="anleitung" aria-label="Anleitung" title="Anleitung"><svg class="icon"><use href="#i-hilfe"/></svg></button>
      <button class="rund" data-ziel="einstellungen" aria-label="Einstellungen" title="Einstellungen"><svg class="icon"><use href="#i-zahnrad"/></svg></button>
    </div>
  </div>

  <main id="inhalt"></main>
</div>

<!-- Handy: Reiterleiste unten -->
<nav id="leiste"></nav>

<!-- Willkommen beim allerersten Öffnen -->
<div id="willkommen" class="verborgen">
  <div class="innen">
    <div class="logo"><img src="bilder/ruebe.png" alt=""><svg viewBox="0 0 810 399" role="img" aria-label="Kraut und Rüben"><use href="#wm"/></svg></div>
    <p class="unter">Geplant, gepflanzt, geerntet.</p>
    <div class="karte">
      <h2>Willkommen!</h2>
      <p>Trag zuerst ein, wo dein Garten liegt. Damit bekommst du auf der Startseite das Wetter, Frostwarnungen und Hinweise auf Trockenphasen.</p>
      <div id="willkommen-ort"></div>
    </div>
    <button class="knopf text" id="willkommen-spaeter">Später eintragen</button>
  </div>
</div>

<dialog id="dialog"></dialog>
<div id="meldung" class="verborgen"></div>

<script>
"use strict";
/* ============================================================
   KRAUT UND RÜBEN – Gartenplaner
   ============================================================ */
const APP_VERSION = "0.2.1";
const SPEICHER_SCHLUESSEL = "kur-daten";
const WETTER_SCHLUESSEL = "kur-wetter";
const DATEN_SCHEMA = 1;

/* ---------- Reiter ---------- */
const REITER = [
  { id: "start",   name: "Start",   icon: "i-start" },
  { id: "garten",  name: "Garten",  icon: "i-garten" },
  { id: "planung", name: "Planung", icon: "i-planung" },
  { id: "chronik", name: "Chronik", icon: "i-chronik" },
  { id: "wissen",  name: "Wissen",  icon: "i-wissen" },
  { id: "vorrat",  name: "Vorrat",  icon: "i-vorrat" },
];
const SONDERSEITEN = { einstellungen: "Einstellungen", anleitung: "Anleitung" };

/* ============================================================
   DATEN
   Alles liegt als ein Objekt im Browser-Speicher (localStorage).
   ============================================================ */
function leereDaten() {
  return {
    schema: DATEN_SCHEMA,
    einstellungen: { standort: null, design: "auto", willkommenGesehen: false },
    garten: { objekte: [], bereiche: [], raster: 10 },  // Maße in cm
    pflanzungen: [],   // was wirklich im Garten steht oder stand
    planungen: [],     // Entwürfe für kommende Jahreszeiten
    sorten: [],        // eigene Sorten mit Bewertung
    saatgut: [],       // Saatgutvorrat
    rezepte: [],       // eigene Rezeptsammlung
    geaendert: null,
  };
}

let D = laden();

function laden() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (!roh) return leereDaten();
    return ergaenzen(JSON.parse(roh));
  } catch (e) {
    console.error("Daten konnten nicht gelesen werden:", e);
    return leereDaten();
  }
}

/* Fehlende Felder (z. B. nach einem Update) mit Standardwerten auffüllen */
function ergaenzen(d) {
  const basis = leereDaten();
  const neu = Object.assign(basis, d);
  neu.einstellungen = Object.assign(leereDaten().einstellungen, d.einstellungen || {});
  neu.garten = Object.assign(leereDaten().garten, d.garten || {});
  return neu;
}

function speichern() {
  D.geaendert = new Date().toISOString();
  try {
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(D));
    return true;
  } catch (e) {
    console.error(e);
    melden("Speichern hat nicht geklappt: " + e.message);
    return false;
  }
}

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, z => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[z]));
}
const icon = id => `<svg class="icon"><use href="#${id}"/></svg>`;
const WOCHENTAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const WOCHENTAGE_LANG = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
function datumText(d) { return `${d.getDate()}. ${MONATE[d.getMonth()]} ${d.getFullYear()}`; }
function zeitText(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE") + ", " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
}
function heuteISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function zahl(n, stellen = 0) {
  let x = Number(n);
  if (Math.abs(x) < 0.5 * Math.pow(10, -stellen)) x = 0; // verhindert „-0“
  return x.toLocaleString("de-DE", { maximumFractionDigits: stellen, minimumFractionDigits: stellen });
}

/* Kurze Meldung unten */
let meldungTimer;
function melden(text, aktion) {
  const m = $("#meldung");
  m.innerHTML = `<span>${esc(text)}</span>`;
  if (aktion) {
    const b = document.createElement("button");
    b.textContent = aktion.text;
    b.onclick = () => { m.classList.add("verborgen"); aktion.tun(); };
    m.appendChild(b);
  }
  m.classList.remove("verborgen");
  clearTimeout(meldungTimer);
  if (!aktion) meldungTimer = setTimeout(() => m.classList.add("verborgen"), 3500);
}

/* Eigene Rückfrage (statt der Browser-Meldung mit Adresszeile) */
function fragen({ titel, text, ja = "OK", nein = "Abbrechen", gefahr = false }) {
  return new Promise(fertig => {
    const dlg = $("#dialog");
    dlg.innerHTML = `<h2 tabindex="-1" autofocus>${esc(titel)}</h2><p>${text}</p>
      <div class="knopfreihe">
        ${nein ? `<button class="knopf" data-a="0">${esc(nein)}</button>` : ""}
        <button class="knopf ${gefahr ? "gefahr voll" : "haupt"}" data-a="1">${esc(ja)}</button>
      </div>`;
    const zu = wert => { dlg.close(); fertig(wert); };
    $$("button", dlg).forEach(b => b.onclick = () => zu(b.dataset.a === "1"));
    dlg.oncancel = e => { e.preventDefault(); zu(false); };
    dlg.showModal();
  });
}

/* Dialog mit Eingabefeldern. Liefert die Werte oder null (Abbrechen). */
function eingabe({ titel, text = "", felder, ja = "OK" }) {
  return new Promise(fertig => {
    const dlg = $("#dialog");
    dlg.innerHTML = `<h2 tabindex="-1" autofocus>${esc(titel)}</h2>${text ? `<p>${text}</p>` : ""}
      <form method="dialog" class="felder">
        ${felder.map(f => `<label>${esc(f.label)}
          <span class="feld-einheit"><input name="${f.id}" type="${f.typ || "text"}" ${f.typ === "number" ? `step="${f.schritt || "any"}" min="${f.min ?? ""}" inputmode="decimal"` : ""} value="${esc(f.wert ?? "")}">${f.einheit ? `<span>${esc(f.einheit)}</span>` : ""}</span></label>`).join("")}
        <div class="knopfreihe">
          <button type="button" class="knopf" data-a="0">Abbrechen</button>
          <button type="submit" class="knopf haupt" data-a="1">${esc(ja)}</button>
        </div>
      </form>`;
    const form = $("form", dlg);
    const zu = ok => {
      const werte = {};
      felder.forEach(f => { const v = form.elements[f.id].value; werte[f.id] = f.typ === "number" ? parseFloat(String(v).replace(",", ".")) : v.trim(); });
      dlg.close(); fertig(ok ? werte : null);
    };
    $('[data-a="0"]', dlg).onclick = () => zu(false);
    form.onsubmit = e => { e.preventDefault(); zu(true); };
    dlg.oncancel = e => { e.preventDefault(); zu(false); };
    dlg.showModal();
  });
}

/* ============================================================
   DESIGN (hell / dunkel / wie das Gerät)
   ============================================================ */
const dunkelAbfrage = window.matchMedia("(prefers-color-scheme: dark)");
function designAnwenden() {
  const w = D.einstellungen.design;
  const dunkel = w === "dunkel" || (w === "auto" && dunkelAbfrage.matches);
  document.documentElement.dataset.theme = dunkel ? "dark" : "light";
  $('meta[name="theme-color"]').setAttribute("content", dunkel ? "#141812" : "#1f4d1a");
}
dunkelAbfrage.addEventListener("change", designAnwenden);

/* ============================================================
   NAVIGATION
   ============================================================ */
function navAufbauen() {
  const links = REITER.map(r => `<a href="#${r.id}" data-reiter="${r.id}">${icon(r.icon)}<span>${r.name}</span></a>`).join("");
  $("#nav-gross").innerHTML = links;
  $("#leiste").innerHTML = links;
  $$("[data-ziel]").forEach(b => b.onclick = () => { location.hash = b.dataset.ziel; });
  $$(".app-version").forEach(e => e.textContent = APP_VERSION);
}

function aktuelleSeite() {
  const h = location.hash.replace("#", "").split("/")[0];
  if (REITER.some(r => r.id === h) || SONDERSEITEN[h]) return h;
  return "start";
}

function zeigen() {
  const seite = aktuelleSeite();
  const titel = SONDERSEITEN[seite] || REITER.find(r => r.id === seite).name;
  $$("[data-reiter]").forEach(a => a.classList.toggle("aktiv", a.dataset.reiter === seite));
  $$("[data-ziel]").forEach(b => b.classList.toggle("aktiv", b.dataset.ziel === seite));
  $("#seitentitel-gross").textContent = seite === "start" ? begruessung() : titel;
  document.title = seite === "start" ? "Kraut und Rüben" : `${titel} · Kraut und Rüben`;
  const main = $("#inhalt");
  main.innerHTML = "";
  (SEITEN[seite] || SEITEN.start)(main);
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeigen);

function begruessung() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return "Guten Morgen";
  if (h >= 18) return "Guten Abend";
  return "Hallo";
}

/* ============================================================
   STANDORT (Ortssuche über Open-Meteo)
   ============================================================ */
function ortsauswahl(ziel, nachher) {
  ziel.innerHTML = `
    <div class="suchzeile">
      <input type="search" placeholder="Ort oder Postleitzahl" aria-label="Ort suchen" autocomplete="off">
      <button class="knopf haupt">Suchen</button>
    </div>
    <button class="knopf text" data-gps>${icon("i-ort")} Aktuellen Standort verwenden</button>
    <ul class="liste"></ul>
    <p class="klein leise ort-info"></p>`;
  const feld = $("input", ziel), liste = $("ul", ziel), info = $(".ort-info", ziel);

  async function suchen() {
    const q = feld.value.trim();
    if (q.length < 2) { info.textContent = "Bitte mindestens zwei Zeichen eingeben."; return; }
    info.textContent = "Suche läuft …";
    liste.innerHTML = "";
    try {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=de&format=json`;
      const r = await fetch(url);
      if (!r.ok) throw new Error("Server antwortet mit " + r.status);
      const j = await r.json();
      const treffer = j.results || [];
      if (!treffer.length) { info.textContent = "Kein Ort gefunden. Versuch es mit einer anderen Schreibweise."; return; }
      info.textContent = "Bitte den richtigen Ort antippen:";
      liste.innerHTML = treffer.map((t, i) => {
        const zusatz = [t.postcodes?.[0], t.admin1, t.country].filter(Boolean).join(", ");
        return `<li><button data-i="${i}"><b>${esc(t.name)}</b> <span class="leise klein">${esc(zusatz)}</span></button></li>`;
      }).join("");
      $$("button", liste).forEach(b => b.onclick = () => {
        const t = treffer[+b.dataset.i];
        uebernehmen({ name: [t.name, t.admin1].filter(Boolean).join(", "), lat: t.latitude, lon: t.longitude });
      });
    } catch (e) {
      info.textContent = "Die Ortssuche hat nicht geklappt (" + e.message + "). Bist du online?";
    }
  }
  function uebernehmen(ort) {
    D.einstellungen.standort = ort;
    speichern();
    localStorage.removeItem(WETTER_SCHLUESSEL);
    melden("Standort gespeichert: " + ort.name);
    nachher && nachher();
  }
  $(".suchzeile button", ziel).onclick = suchen;
  feld.addEventListener("keydown", e => { if (e.key === "Enter") suchen(); });
  $("[data-gps]", ziel).onclick = () => {
    if (!navigator.geolocation) { info.textContent = "Dein Browser kann den Standort nicht ermitteln."; return; }
    info.textContent = "Standort wird ermittelt …";
    navigator.geolocation.getCurrentPosition(
      p => uebernehmen({ name: "Mein Garten (per Standortfreigabe)", lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }),
      () => { info.textContent = "Der Standort konnte nicht ermittelt werden. Such stattdessen nach deinem Ort."; },
      { timeout: 10000 }
    );
  };
}

/* ============================================================
   WETTER (Open-Meteo, ohne Anmeldung)
   Tiefstwert ≤ 0 °C  → Frost
   Tiefstwert unter 4 °C → Bodenfrost möglich (am Boden oft einige Grad kälter als in 2 m Höhe)
   Höchstwert ab 30 °C → Hitze
   Trockenphase: letzte 7 Tage unter 5 mm Regen und nächste 3 Tage unter 3 mm, bei mindestens 12 °C am Tag
   ============================================================ */
const GRENZEN = { frost: 0, bodenfrost: 4, hitze: 30, trockenVorher: 5, trockenNachher: 3, trockenWaerme: 12 };

const WETTERCODES = {
  0: ["☀️", "Klar"], 1: ["🌤️", "Überwiegend klar"], 2: ["⛅", "Teils bewölkt"], 3: ["☁️", "Bedeckt"],
  45: ["🌫️", "Nebel"], 48: ["🌫️", "Nebel mit Reif"],
  51: ["🌦️", "Leichter Niesel"], 53: ["🌦️", "Niesel"], 55: ["🌧️", "Starker Niesel"], 56: ["🌧️", "Gefrierender Niesel"], 57: ["🌧️", "Gefrierender Niesel"],
  61: ["🌧️", "Leichter Regen"], 63: ["🌧️", "Regen"], 65: ["🌧️", "Starker Regen"], 66: ["🌧️", "Gefrierender Regen"], 67: ["🌧️", "Gefrierender Regen"],
  71: ["🌨️", "Leichter Schnee"], 73: ["🌨️", "Schnee"], 75: ["❄️", "Starker Schnee"], 77: ["🌨️", "Schneegriesel"],
  80: ["🌦️", "Regenschauer"], 81: ["🌦️", "Regenschauer"], 82: ["⛈️", "Heftige Schauer"],
  85: ["🌨️", "Schneeschauer"], 86: ["🌨️", "Schneeschauer"],
  95: ["⛈️", "Gewitter"], 96: ["⛈️", "Gewitter mit Hagel"], 99: ["⛈️", "Gewitter mit Hagel"],
};

async function wetterHolen() {
  const ort = D.einstellungen.standort;
  if (!ort) return null;
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(WETTER_SCHLUESSEL) || "null"); } catch (e) {}
  const passt = cache && cache.lat === ort.lat && cache.lon === ort.lon;
  if (passt && Date.now() - cache.zeit < 60 * 60 * 1000) return cache;
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + ort.lat + "&longitude=" + ort.lon +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max" +
      "&past_days=7&forecast_days=7&timezone=auto";
    const r = await fetch(url);
    if (!r.ok) throw new Error("Server antwortet mit " + r.status);
    const j = await r.json();
    const neu = { lat: ort.lat, lon: ort.lon, zeit: Date.now(), daily: j.daily };
    localStorage.setItem(WETTER_SCHLUESSEL, JSON.stringify(neu));
    return neu;
  } catch (e) {
    console.warn("Wetter konnte nicht geladen werden:", e);
    if (passt) return Object.assign({ veraltet: true }, cache);
    throw e;
  }
}

/* Tage in Vergangenheit und Vorhersage aufteilen */
function wetterAufbereiten(w) {
  const d = w.daily, heute = heuteISO(), tage = [];
  d.time.forEach((t, i) => tage.push({
    datum: t, code: d.weather_code[i], max: d.temperature_2m_max[i], min: d.temperature_2m_min[i],
    regen: d.precipitation_sum[i] ?? 0, chance: d.precipitation_probability_max?.[i],
  }));
  return { vorher: tage.filter(t => t.datum < heute), kommend: tage.filter(t => t.datum >= heute) };
}

function tagName(iso, lang = false) {
  if (iso === heuteISO()) return "heute";
  const d = new Date(iso + "T12:00:00");
  const morgen = new Date(); morgen.setDate(morgen.getDate() + 1);
  if (d.toDateString() === morgen.toDateString()) return "morgen";
  return (lang ? WOCHENTAGE_LANG : WOCHENTAGE)[d.getDay()];
}

function wetterHinweise({ vorher, kommend }) {
  const h = [];
  const frostTage = kommend.filter(t => t.min <= GRENZEN.frost);
  const bodenTage = kommend.filter(t => t.min > GRENZEN.frost && t.min < GRENZEN.bodenfrost);
  if (frostTage.length) {
    const kalt = frostTage.reduce((a, b) => (b.min < a.min ? b : a));
    h.push({ art: "frost", sym: "❄️", titel: "Frost erwartet",
      text: `Tiefstwerte bis ${zahl(kalt.min, 1)} °C (${frostTage.map(t => tagName(t.datum)).join(", ")}). Empfindliche Pflanzen abdecken oder hereinholen, Gießwasser und Leitungen schützen.` });
  } else if (bodenTage.length) {
    const kalt = bodenTage.reduce((a, b) => (b.min < a.min ? b : a));
    h.push({ art: "frost", sym: "🌡️", titel: "Bodenfrost möglich",
      text: `Tiefstwert ${zahl(kalt.min, 1)} °C (${bodenTage.map(t => tagName(t.datum)).join(", ")}). In klaren, windstillen Nächten kann es am Boden einige Grad kälter sein als angezeigt.` });
  }
  const heiss = kommend.filter(t => t.max >= GRENZEN.hitze);
  if (heiss.length) {
    const max = Math.max(...heiss.map(t => t.max));
    h.push({ art: "hitze", sym: "🔥", titel: "Hitze",
      text: `Bis ${zahl(max, 0)} °C (${heiss.map(t => tagName(t.datum)).join(", ")}). Früh morgens oder abends gießen, empfindliche Pflanzen schattieren.` });
  }
  const regenVorher = vorher.reduce((s, t) => s + (t.regen || 0), 0);
  const naechste3 = kommend.slice(0, 3);
  const regenNachher = naechste3.reduce((s, t) => s + (t.regen || 0), 0);
  const warm = naechste3.length && naechste3.reduce((s, t) => s + t.max, 0) / naechste3.length >= GRENZEN.trockenWaerme;
  if (vorher.length >= 5 && regenVorher < GRENZEN.trockenVorher && regenNachher < GRENZEN.trockenNachher && warm) {
    h.push({ art: "warn", sym: "💧", titel: "Trockenphase",
      text: `In den letzten 7 Tagen nur ${zahl(regenVorher, 1)} mm Regen, und auch in den nächsten Tagen kommt kaum etwas dazu. Beete, Jungpflanzen und Kübel gießen.` });
  }
  if (!h.length) h.push({ art: "ok", sym: "✅", titel: "Keine Warnungen", text: "Kein Frost, keine Hitze und keine Trockenphase in Sicht." });
  return { hinweise: h, regenVorher };
}

async function wetterKarte(ziel) {
  const ort = D.einstellungen.standort;
  if (!ort) {
    ziel.innerHTML = `<h2>🌦️ Wetter</h2>
      <p>Trag deinen Standort ein, dann siehst du hier die Vorhersage mit Frost- und Trockenwarnungen.</p>
      <a class="knopf haupt" href="#einstellungen">${icon("i-ort")} Standort eintragen</a>`;
    return;
  }
  ziel.innerHTML = `<h2>🌦️ Wetter <span class="leise klein" style="font-weight:400">· ${esc(ort.name)}</span></h2><p class="leise">Wetter wird geladen …</p>`;
  let w;
  try { w = await wetterHolen(); }
  catch (e) {
    ziel.innerHTML = `<h2>🌦️ Wetter</h2><p>Das Wetter konnte gerade nicht geladen werden. Bist du online?</p>
      <p class="klein leise">Technischer Grund: ${esc(e.message)}</p>`;
    return;
  }
  const auf = wetterAufbereiten(w);
  const { hinweise, regenVorher } = wetterHinweise(auf);
  const tage = auf.kommend.slice(0, 7).map(t => {
    const [sym, text] = WETTERCODES[t.code] || ["❔", "Unbekannt"];
    const frost = t.min <= GRENZEN.frost || t.min < GRENZEN.bodenfrost;
    return `<div class="tag ${t.datum === heuteISO() ? "heute" : ""}" title="${esc(text)}">
      <div class="wt">${t.datum === heuteISO() ? "Heute" : WOCHENTAGE[new Date(t.datum + "T12:00:00").getDay()]}</div>
      <div class="sym" aria-label="${esc(text)}">${sym}</div>
      <div class="max">${zahl(t.max, 0)}°</div>
      <div class="min ${frost ? "frost" : ""}">${zahl(t.min, 0)}°</div>
      <div class="regen">${t.regen >= 0.5 ? zahl(t.regen, 0) + " mm" : ""}</div>
    </div>`;
  }).join("");
  ziel.innerHTML = `<h2>🌦️ Wetter <span class="leise klein" style="font-weight:400">· ${esc(ort.name)}</span></h2>
    <div class="wettertage">${tage}</div>

/* ============================================================
   GARTENPLAN

const ARTEN = {

  rasen:        { name: "Rasen", ebene: 1, b: 500, t: 400 },

  haus:         { name: "Haus", ebene: 2, b: 1000, t: 800, ohneNummer: true },
  sonstiges:    { name: "Sonstiges", ebene: 2, b: 200, t: 200, hinweis: "Schuppen, Kompost, Teich …" },
  beet:         { name: "Beet", ebene: 3, b: 120, t: 300, pflanzbar: true },
  hochbeet:     { name: "Hochbeet", ebene: 3, b: 80, t: 200, pflanzbar: true },
  gewaechshaus: { name: "Gewächshaus", ebene: 3, b: 200, t: 300, pflanzbar: true },
  kuebel:       { name: "Kübel", ebene: 3, kreis: true, r: 25, pflanzbar: true },
};
const ART_REIHENFOLGE = ["garten", "haus", "weg", "pfad", "terrasse", "rasen", "beet", "hochbeet", "gewaechshaus", "kuebel", "sonstiges"];
const formVon = art => (ARTEN[art].kreis ? "kreis" : ARTEN[art].linie ? "linie" : "poly");

const G = {               // Zustand des Plans (nicht gespeichert)
  view: null,             // sichtbarer Ausschnitt {x, y, w} in cm
  auswahl: null,          // id des gewählten Objekts
  ecke: null,             // Index der gewählten Ecke
  bearbeiten: null,       // Bearbeiten-Modus an/aus
  zurueck: [], vor: [],   // Rückgängig / Wiederholen
  zeiger: new Map(), zug: null,
  fuehrung: null,         // Hilfslinien beim Ziehen {x, y}
};

const gid = () => Math.random().toString(36).slice(2, 10);
const objekt = id => D.garten.objekte.find(o => o.id === id);
const kopie = x => JSON.parse(JSON.stringify(x));
function m(cm) { // „1,2 m“ ohne unnötige Nullen
  return (Math.round(cm) / 100).toLocaleString("de-DE", { maximumFractionDigits: 2 }) + " m";
}
function rasterwert(e) { return e && e.shiftKey ? 1 : (D.garten.raster || 10); }
function einrasten(v, r) { return Math.round(v / r) * r; }
const editierbar = o => !!(o && G.bearbeiten && !o.fest);

/* ---------- Geschwungene Linien (Catmull-Rom als Bézier) ---------- */
function bezierTeile(p, geschlossen) {
  const n = p.length, teile = [];
  const pt = i => geschlossen ? p[(i + n) % n] : p[Math.max(0, Math.min(n - 1, i))];
  const anzahl = geschlossen ? n : n - 1;
  for (let i = 0; i < anzahl; i++) {
    const p0 = pt(i - 1), p1 = pt(i), p2 = pt(i + 1), p3 = pt(i + 2);
    teile.push([p1, [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6], p2]);
  }
  return teile;
}
function bezierPunkt([a, b, c, d], t) {
  const u = 1 - t;
  return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0],
          u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]];
}
function pfadD(p, geschlossen, rund) {
  if (!rund || p.length < 3) return "M" + p.map(q => q.join(" ")).join("L") + (geschlossen ? "Z" : "");
  return "M" + p[0].join(" ") + bezierTeile(p, geschlossen).map(([, b, c, d]) => `C${b.join(" ")} ${c.join(" ")} ${d.join(" ")}`).join("") + (geschlossen ? "Z" : "");
}
function abtasten(p, geschlossen, rund, je = 12) {
  if (!rund || p.length < 3) return geschlossen ? p : p.slice();
  const out = [];
  bezierTeile(p, geschlossen).forEach(t => { for (let k = 0; k < je; k++) out.push(bezierPunkt(t, k / je)); });
  if (!geschlossen) out.push(p[p.length - 1]);
  return out;
}
/* Mitte eines Abschnitts (auf der Kurve, falls geschwungen) */
function abschnittMitte(o, i) {
  const p = o.punkte, geschlossen = o.form === "poly", n = p.length;
  if (o.rund && n >= 3) return bezierPunkt(bezierTeile(p, geschlossen)[i], 0.5);
  const a = p[i], b = p[(i + 1) % n];
  return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
}

/* ---------- Geometrie ---------- */
function umriss(o) {        // Umriss als Punktliste (Kreise und Kurven abgetastet)
  if (o.form === "kreis") return Array.from({ length: 36 }, (_, k) => [o.x + o.r * Math.cos(k * Math.PI / 18), o.y + o.r * Math.sin(k * Math.PI / 18)]);
  return abtasten(o.punkte, o.form === "poly", o.rund);
}
function laengeLinie(pts) { let l = 0; for (let i = 1; i < pts.length; i++) l += abstand(pts[i - 1], pts[i]); return l; }
function flaeche(o) {
  if (o.form === "kreis") return Math.PI * o.r * o.r;
  if (o.form === "linie") return laengeLinie(umriss(o)) * o.breite;
  const p = umriss(o); let a = 0;
  for (let i = 0; i < p.length; i++) { const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length]; a += x1 * y2 - x2 * y1; }
  return Math.abs(a / 2);
}
function rahmen(o) {
  if (o.form === "kreis") return { x1: o.x - o.r, y1: o.y - o.r, x2: o.x + o.r, y2: o.y + o.r };
  const p = umriss(o), z = o.form === "linie" ? o.breite / 2 : 0;
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  return { x1: Math.min(...xs) - z, y1: Math.min(...ys) - z, x2: Math.max(...xs) + z, y2: Math.max(...ys) + z };
}
function schwerpunkt(o) {

/* ---------- Rückgängig ---------- */

/* ---------- Ansicht ---------- */

  const rs = ob.map(rahmen);

/* ---------- Abstände zu den Nachbarn (gestrichelte Linien) ---------- */

    if (q.id === o.id || q.form === "linie") continue;
    const p = umriss(q);
    for (let i = 0; i < p.length; i++) kanten.push([p[i], p[(i + 1) % p.length]]);
  }
  const ergebnis = [];
  const richtungen = [
    { start: [r.x1, cy], achse: 0, vz: -1 }, { start: [r.x2, cy], achse: 0, vz: 1 },
    { start: [cx, r.y1], achse: 1, vz: -1 }, { start: [cx, r.y2], achse: 1, vz: 1 },
  ];
  for (const ri of richtungen) {

/* ---------- Einrasten mit Hilfslinien ---------- */

/* ---------- Zeichnen ---------- */

function planZeichnen() {

      ? (o.form === "kreis" ? "Ø " + m(o.r * 2) : (istRechteck(o) ? `${m(r.x2 - r.x1)} × ${m(r.y2 - r.y1)}` : zahl(flaeche(o) / 10000, 1) + " m²")) : "";

  const el = $("#massstab"); if (!el) return;

  const stufen = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
  const l = stufen.find(x => x >= 90 / s) || 10000;
  el.innerHTML = `<div style="width:${l * s}px"></div>${m(l)}`;
}

/* ---------- Objekte anlegen und ändern ---------- */
function neuerName(art) {
  const a = ARTEN[art], basis = a.kurz || a.name;
  const anzahl = D.garten.objekte.filter(o => o.art === art).length;
  if (a.ohneNummer && anzahl === 0) return basis;
  let n = anzahl + 1;
  while (D.garten.objekte.some(o => o.name === `${basis} ${n}`)) n++;
  return `${basis} ${n}`;
}
function hinzufuegen(art, masse) {
  const a = ARTEN[art], vorher = stand(), r = D.garten.raster || 10;
  const g = planGroesse();
  let [cx, cy] = welt(g.l + g.b / 2, g.o + g.h / 2);
  cx = einrasten(cx, r); cy = einrasten(cy, r);
  let o;
  if (a.kreis) o = { id: gid(), art, name: neuerName(art), form: "kreis", x: cx, y: cy, r: a.r };
  else if (a.linie) {
    const l = einrasten(Math.min(400, G.view.w / 4), r);
    o = { id: gid(), art, name: neuerName(art), form: "linie", breite: a.breite, rund: true, punkte: [[cx - l / 2, cy], [cx, cy], [cx + l / 2, cy]] };
  } else {
    const b = masse ? masse.b : a.b, t = masse ? masse.t : a.t;
    const x = masse ? 0 : einrasten(cx - b / 2, r), y = masse ? 0 : einrasten(cy - t / 2, r);
    o = { id: gid(), art, name: neuerName(art), form: "poly", punkte: [[x, y], [x + b, y], [x + b, y + t], [x, y + t]] };
  }
  D.garten.objekte.push(o);
  G.auswahl = o.id; G.ecke = null; G.bearbeiten = true;
  merken(vorher);
  if (masse) allesZeigen(); else planZeichnen();
  panelZeichnen(); leisteAktualisieren();
}
async function gartenflaecheAnlegen() {
  const w = await eingabe({
    titel: "Gartenfläche anlegen",
    text: "Gib ungefähr an, wie groß deine Gartenfläche ist. Es entsteht ein Rechteck, das du danach in die echte Form ziehen kannst.",
    felder: [
      { id: "b", label: "Breite", typ: "number", wert: 12, schritt: 0.1, min: 1, einheit: "m" },
      { id: "t", label: "Tiefe", typ: "number", wert: 8, schritt: 0.1, min: 1, einheit: "m" },
    ],
    ja: "Anlegen",
  });
  if (!w || !(w.b > 0) || !(w.t > 0)) return;
  hinzufuegen("garten", { b: Math.round(w.b * 100), t: Math.round(w.t * 100) });
}
function loeschen(id) {
  const o = objekt(id); if (!o) return;
  const vorher = stand();
  D.garten.objekte = D.garten.objekte.filter(x => x.id !== id);
  G.auswahl = null; G.ecke = null;
  merken(vorher); planZeichnen(); panelZeichnen(); leisteAktualisieren();
  melden(`„${o.name}“ gelöscht.`, { text: "Rückgängig", tun: rueckgaengig });
}
function duplizieren(id) {
  const o = objekt(id); if (!o) return;
  const vorher = stand(), k = kopie(o), d = 50;
  k.id = gid(); k.name = neuerName(o.art); delete k.fest;
  if (k.form === "kreis") { k.x += d; k.y += d; } else k.punkte = k.punkte.map(([x, y]) => [x + d, y + d]);
  D.garten.objekte.push(k); G.auswahl = k.id; G.ecke = null;
  merken(vorher); planZeichnen(); panelZeichnen();
}
function drehen(id, grad) {
  const o = objekt(id); if (!o || o.form === "kreis") return;
  const vorher = stand(), [cx, cy] = schwerpunkt(o), w = grad * Math.PI / 180, c = Math.cos(w), sn = Math.sin(w);
  o.punkte = o.punkte.map(([x, y]) => [Math.round(cx + (x - cx) * c - (y - cy) * sn), Math.round(cy + (x - cx) * sn + (y - cy) * c)]);
  merken(vorher); planZeichnen(); panelZeichnen();
}
function verschieben(id, dx, dy) {
  const o = objekt(id); if (!o) return;
  if (o.form === "kreis") { o.x += dx; o.y += dy; } else o.punkte = o.punkte.map(([x, y]) => [x + dx, y + dy]);
}
function eckeEntfernen(id, i) {
  const o = objekt(id); if (!o || o.form === "kreis" || i === null) return;
  const min = o.form === "linie" ? 2 : 3;
  if (o.punkte.length <= min) { melden(o.form === "linie" ? "Ein Weg braucht mindestens zwei Punkte." : "Eine Fläche braucht mindestens drei Ecken."); return; }
  const vorher = stand();
  o.punkte.splice(i, 1); G.ecke = null;
  merken(vorher); planZeichnen(); panelZeichnen();
}
function festSetzen(id, fest) {
  const o = objekt(id); if (!o) return;
  const vorher = stand();
  if (fest) o.fest = true; else delete o.fest;
  G.ecke = null;
  merken(vorher); planZeichnen(); panelZeichnen();
}
function waehlen(id) {
  G.auswahl = id; G.ecke = null; G.fuehrung = null;
  planZeichnen(); panelZeichnen(); leisteAktualisieren();
}

/* ---------- Maus, Finger, Tastatur ---------- */
function planEreignisse() {
  const svg = $("#plan");
  svg.addEventListener("pointerdown", e => {
    G.zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    if (G.zeiger.size === 2) {           // zwei Finger: zoomen
      const [a, b] = [...G.zeiger.values()];
      if (G.zug && G.zug.vorher && G.zug.bewegt) wiederherstellen(G.zug.vorher);
      G.fuehrung = null;
      G.zug = { art: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y), view0: { ...G.view }, mitte: welt((a.x + b.x) / 2, (a.y + b.y) / 2) };
      return;
    }
    if (G.zeiger.size > 2) return;
    const t = e.target.closest("[data-rolle]"), rolle = t && t.dataset.rolle;
    const w = welt(e.clientX, e.clientY), start = { x: e.clientX, y: e.clientY };
    const o = G.auswahl && objekt(G.auswahl), ed = editierbar(o);
    if (ed && rolle === "griff") {
      G.ecke = +t.dataset.i;
      G.zug = { art: "ecke", i: G.ecke, vorher: stand(), start, bewegt: false };
      planZeichnen(); panelZeichnen();
    } else if (ed && rolle === "neu") {
      const i = +t.dataset.i, r = rasterwert(e), vorher = stand(), mitte = abschnittMitte(o, i);
      o.punkte.splice(i + 1, 0, [einrasten(mitte[0], r), einrasten(mitte[1], r)]);
      G.ecke = i + 1;
      G.zug = { art: "ecke", i: i + 1, vorher, start, bewegt: true };
      planZeichnen();
    } else if (ed && rolle === "verlaengern") {
      const vorher = stand(), r = rasterwert(e), neu = [einrasten(w[0], r), einrasten(w[1], r)];
      if (t.dataset.ende === "0") { o.punkte.unshift(neu); G.ecke = 0; } else { o.punkte.push(neu); G.ecke = o.punkte.length - 1; }
      G.zug = { art: "ecke", i: G.ecke, vorher, start, bewegt: true };
      planZeichnen();
    } else if (ed && rolle === "radius") {
      G.zug = { art: "radius", vorher: stand(), start, bewegt: false };
    } else if (rolle === "obj" && ed && t.dataset.id === G.auswahl) {
      // Nur das bereits gewählte Objekt lässt sich verschieben
      G.zug = { art: "obj", id: o.id, w0: w, orig: kopie(o), vorher: stand(), start, bewegt: false };
    } else {
      G.zug = { art: "pan", start, view0: { ...G.view }, klickId: rolle === "obj" ? t.dataset.id : null, bewegt: false };
    }
    svg.classList.add("ziehen");
  });

  svg.addEventListener("pointermove", e => {
    if (!G.zeiger.has(e.pointerId)) return;
    G.zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const z = G.zug; if (!z) return;
    if (z.art === "pinch") {
      const [a, b] = [...G.zeiger.values()]; if (!b) return;
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, g = planGroesse();
      const neuW = Math.min(Math.max(z.view0.w * z.d0 / d, 40), 30000);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const fx = (mx - g.l) / g.b, fy = (my - g.o) / g.h;
      G.view = { x: z.mitte[0] - fx * neuW, y: z.mitte[1] - fy * neuW * g.h / g.b, w: neuW };
      planZeichnen(); return;
    }
    if (!z.bewegt && Math.hypot(e.clientX - z.start.x, e.clientY - z.start.y) < 4) return;
    z.bewegt = true;
    const w = welt(e.clientX, e.clientY);
    if (z.art === "pan") {
      const s = massstab();
      G.view = { ...z.view0, x: z.view0.x - (e.clientX - z.start.x) / s, y: z.view0.y - (e.clientY - z.start.y) / s };
      planZeichnen();
    } else if (z.art === "obj") {
      const o = objekt(z.id), [dx, dy] = verschiebungFangen(z, w, e);
      if (o.form === "kreis") { o.x = z.orig.x + dx; o.y = z.orig.y + dy; }
      else o.punkte = z.orig.punkte.map(([x, y]) => [x + dx, y + dy]);
      planZeichnen();
    } else if (z.art === "ecke") {
      const o = objekt(G.auswahl); o.punkte[z.i] = eckeFangen(o, z.i, w, e);
      planZeichnen();
    } else if (z.art === "radius") {
      const o = objekt(G.auswahl); o.r = Math.max(5, einrasten(Math.hypot(w[0] - o.x, w[1] - o.y), Math.min(rasterwert(e), 5)));
      planZeichnen();
    }
  });

  const ende = e => {
    G.zeiger.delete(e.pointerId);
    const z = G.zug; if (!z) return;
    if (z.art === "pinch") { if (G.zeiger.size === 0) G.zug = null; return; }
    G.zug = null; G.fuehrung = null; svg.classList.remove("ziehen");
    if (z.art === "pan" && !z.bewegt) waehlen(z.klickId);
    else { if (z.vorher) { merken(z.vorher); panelZeichnen(); } planZeichnen(); }
    leisteAktualisieren();
  };
  svg.addEventListener("pointerup", ende);
  svg.addEventListener("pointercancel", ende);

  svg.addEventListener("dblclick", e => {
    const t = e.target.closest('[data-rolle="griff"]');
    if (t && editierbar(objekt(G.auswahl))) eckeEntfernen(G.auswahl, +t.dataset.i);
  });

  svg.addEventListener("wheel", e => {
    e.preventDefault();
    zoomen(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
  }, { passive: false });
}

function gartenTasten(e) {
  if (aktuelleSeite() !== "garten" || $("#dialog").open) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  const strg = e.ctrlKey || e.metaKey;
  if (strg && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? wiederholen() : rueckgaengig(); return; }
  if (strg && e.key.toLowerCase() === "y") { e.preventDefault(); wiederholen(); return; }
  if (e.key === "Escape") { waehlen(null); return; }
  const o = G.auswahl && objekt(G.auswahl);
  if (!editierbar(o)) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    e.preventDefault();
    if (G.ecke !== null) eckeEntfernen(o.id, G.ecke); else loeschen(o.id);
    return;
  }
  const schritte = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (schritte) {
    e.preventDefault();
    const d = (D.garten.raster || 10) * (e.shiftKey ? 10 : 1), vorher = stand();
    verschieben(o.id, schritte[0] * d, schritte[1] * d);
    merken(vorher); planZeichnen();
  }
}
document.addEventListener("keydown", gartenTasten);

/* ---------- Werkzeugleiste ---------- */
function leisteAktualisieren() {
  const l = $(".plan-leiste"); if (!l) return;
  $("#k-bearbeiten").classList.toggle("an", !!G.bearbeiten);
  $("#k-bearbeiten").innerHTML = `✏️<span class="lang"> Bearbeiten${G.bearbeiten ? ": an" : ""}</span>`;
  $("#k-bearbeiten").title = G.bearbeiten ? "Bearbeiten ist an – tippen zum Ausschalten" : "Bearbeiten einschalten";
  $("#k-zurueck").disabled = !G.zurueck.length;
  $("#k-vor").disabled = !G.vor.length;
  $("#k-hinzu").classList.toggle("verborgen", !G.bearbeiten);
  const sel = $("#k-bereich");
  sel.innerHTML = `<option value="">Springe zu …</option><option value="alles">Ganzer Garten</option>` +
    D.garten.bereiche.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join("");
}
function farbpunkt(art) {
  const a = ARTEN[art];
  return `<span class="farbpunkt${a.kreis ? " rund" : a.linie ? " linie" : ""}" style="background:var(--f-${art === "pfad" ? "weg" : art});border-color:var(--s-${art === "pfad" ? "weg" : art})"></span>`;
}
async function bereichMerken() {
  const w = await eingabe({ titel: "Ansicht als Bereich merken", text: "Der jetzige Ausschnitt bekommt einen Namen. Über „Springe zu …“ kommst du jederzeit direkt hierher.", felder: [{ id: "name", label: "Name", wert: "", typ: "text" }], ja: "Merken" });
  if (!w || !w.name) return;
  const vorher = stand(), v = G.view;
  D.garten.bereiche.push({ id: gid(), name: w.name, x: Math.round(v.x), y: Math.round(v.y), w: Math.round(v.w), h: Math.round(viewHoehe()) });
  merken(vorher); leisteAktualisieren(); panelZeichnen();
  melden(`Bereich „${w.name}“ gemerkt.`);
}

/* ---------- Seitenleiste (Panel) ---------- */
function groesseText(o) {
  const r = rahmen(o), fl = flaeche(o) / 10000;
  if (o.form === "kreis") return `Ø ${m(o.r * 2)} · ${zahl(fl, 2)} m²`;
  if (o.form === "linie") return `${m(laengeLinie(umriss(o)))} lang, ${m(o.breite)} breit`;
  return (istRechteck(o) ? `${m(r.x2 - r.x1)} × ${m(r.y2 - r.y1)} · ` : "") + `${zahl(fl, fl < 10 ? 2 : 1)} m²`;
}
function panelZeichnen() {
  const el = $("#garten-panel"); if (!el) return;
  const o = G.auswahl && objekt(G.auswahl);
  if (!o) { el.innerHTML = uebersichtHTML(); uebersichtEreignisse(el); return; }
  const a = ARTEN[o.art], r = rahmen(o), form = o.form;
  let h = `<div class="karte"><h2>${farbpunkt(o.art)} ${esc(o.name)}${o.fest ? " 🔒" : ""}</h2>`;
  if (!G.bearbeiten || o.fest) {
    h += `<p class="leise">${esc(a.name)} · ${groesseText(o)}</p>`;
    if (o.fest) h += `<p class="klein leise">Fixiert: Diese Fläche lässt sich nicht verschieben oder verformen. Ziehen auf ihr verschiebt nur den Ausschnitt.</p>
      <button class="knopf" data-tun="loesen">🔓 Lösen</button>`;
    else h += `<button class="knopf" data-tun="bearbeiten">✏️ Bearbeiten</button>`;
    h += `</div>`;
    el.innerHTML = h; panelEreignisse(el, o); return;
  }
  h += `<label>Name</label><input type="text" data-feld="name" value="${esc(o.name)}">
    <label>Art</label><select data-feld="art">${ART_REIHENFOLGE.filter(k => formVon(k) === form).map(k => `<option value="${k}" ${k === o.art ? "selected" : ""}>${ARTEN[k].name}</option>`).join("")}</select>`;
  if (form === "kreis") {
    h += `<label>Durchmesser</label><div class="feld-einheit"><input type="number" step="0.05" min="0.1" inputmode="decimal" data-feld="durchmesser" value="${(o.r * 2 / 100).toFixed(2)}"><span>m</span></div>`;
  } else if (form === "linie") {
    h += `<label>Breite des Wegs</label><div class="feld-einheit"><input type="number" step="0.05" min="0.1" inputmode="decimal" data-feld="wegbreite" value="${(o.breite / 100).toFixed(2)}"><span>m</span></div>`;
  } else if (istRechteck(o)) {
    h += `<div class="zwei">
      <div><label>Breite</label><div class="feld-einheit"><input type="number" step="0.05" min="0.05" inputmode="decimal" data-feld="breite" value="${((r.x2 - r.x1) / 100).toFixed(2)}"><span>m</span></div></div>
      <div><label>Tiefe</label><div class="feld-einheit"><input type="number" step="0.05" min="0.05" inputmode="decimal" data-feld="tiefe" value="${((r.y2 - r.y1) / 100).toFixed(2)}"><span>m</span></div></div></div>`;
  }
  if (form !== "kreis") h += `<label class="schalter"><input type="checkbox" data-feld="rund" ${o.rund ? "checked" : ""}> Geschwungen (Kanten als weiche Kurve)</label>`;
  h += `<p class="klein leise" style="margin:10px 0 0">${groesseText(o)}</p>
    <div class="knopfreihe"><button class="knopf" data-tun="fixieren">🔒 Fixieren</button></div>
    ${o.art === "garten" || o.art === "haus" ? `<p class="klein leise" style="margin:6px 0 0">Tipp: Passt die Form, fixiere sie. Dann verrutscht nichts, während du Beete platzierst.</p>` : ""}
  </div>`;
  if (form === "poly" && !o.rund) {
    h += `<div class="karte"><details ${istRechteck(o) ? "" : "open"}><summary><b>Kanten und Ecken</b></summary>
      <p class="klein leise">Länge eintippen: Die zweite Ecke der Kante rückt auf das genaue Maß.</p>
      <div class="kanten">${o.punkte.map((p, i) => { const w = winkelAn(o.punkte, i); return `<span>Kante ${i + 1}</span><div class="feld-einheit"><input type="number" step="0.01" min="0.01" inputmode="decimal" data-kante="${i}" value="${(abstand(p, o.punkte[(i + 1) % o.punkte.length]) / 100).toFixed(2)}"><span>m</span><span class="klein leise" title="Winkel an Ecke ${i + 1}">${w === null ? "" : (Math.abs(w - 90) < 0.3 ? "∟ 90°" : zahl(w, 0) + "°")}</span></div>`; }).join("")}</div>
      ${G.ecke !== null ? `<div class="knopfreihe"><button class="knopf gefahr" data-tun="ecke-weg">Ecke ${G.ecke + 1} entfernen</button></div>` : ""}
    </details></div>`;
  } else if (form !== "kreis" && G.ecke !== null) {
    h += `<div class="karte"><div class="knopfreihe" style="margin:0"><button class="knopf gefahr" data-tun="ecke-weg">Punkt ${G.ecke + 1} entfernen</button></div></div>`;
  }
  h += `<div class="karte"><div class="knopfreihe" style="margin:0">
      ${form === "kreis" ? "" : `<button class="knopf" data-tun="drehen90">↻ 90° drehen</button><button class="knopf" data-tun="drehen">Drehen um …</button>`}
      <button class="knopf" data-tun="duplizieren">⧉ Duplizieren</button>
      <button class="knopf gefahr" data-tun="loeschen">🗑️ Löschen</button>
    </div></div>
    <p class="klein leise">${form === "kreis" ? "Ziehen verschiebt den Kreis, der Punkt rechts ändert die Größe." :
      form === "linie" ? "Punkte ziehen formt den Weg. Das Plus zwischen zwei Punkten fügt einen Punkt ein, das Plus an den Enden verlängert den Weg." :
      "Ziehen verschiebt die Fläche. Ecken ziehen ändert die Form, das Plus auf einer Kante fügt eine Ecke ein, Doppelklick auf eine Ecke entfernt sie."}
      Blau gestrichelt: Abstand zur nächsten Kante. Ecken rasten an anderen Ecken ein (rote Hilfslinie). Umschalttaste = frei, ohne Einrasten.</p>`;
  el.innerHTML = h;
  panelEreignisse(el, o);
}

function panelEreignisse(el, o) {
  const aendern = fn => { const vorher = stand(); fn(); merken(vorher); planZeichnen(); panelZeichnen(); leisteAktualisieren(); };
  $$("[data-feld]", el).forEach(f => f.addEventListener("change", () => {
    const wert = f.value, zahlwert = parseFloat(String(wert).replace(",", "."));
    aendern(() => {
      const feld = f.dataset.feld;
      if (feld === "name") o.name = wert.trim() || o.name;
      else if (feld === "art") o.art = wert;
      else if (feld === "rund") { if (f.checked) o.rund = true; else delete o.rund; }
      else if (feld === "durchmesser" && zahlwert > 0) o.r = Math.round(zahlwert * 50);
      else if (feld === "wegbreite" && zahlwert > 0) o.breite = Math.round(zahlwert * 100);
      else if ((feld === "breite" || feld === "tiefe") && zahlwert > 0) {
        const r = rahmen(o);
        const b = feld === "breite" ? Math.round(zahlwert * 100) : r.x2 - r.x1;
        const t = feld === "tiefe" ? Math.round(zahlwert * 100) : r.y2 - r.y1;
        o.punkte = [[r.x1, r.y1], [r.x1 + b, r.y1], [r.x1 + b, r.y1 + t], [r.x1, r.y1 + t]];
      }
    });
  }));
  $$("[data-kante]", el).forEach(f => f.addEventListener("change", () => {
    const l = parseFloat(String(f.value).replace(",", ".")); if (!(l > 0)) return;
    const i = +f.dataset.kante, n = o.punkte.length, a = o.punkte[i], b = o.punkte[(i + 1) % n], alt = abstand(a, b) || 1;
    aendern(() => { o.punkte[(i + 1) % n] = [Math.round(a[0] + (b[0] - a[0]) / alt * l * 100), Math.round(a[1] + (b[1] - a[1]) / alt * l * 100)]; });
  }));
  $$("[data-tun]", el).forEach(k => k.onclick = async () => {
    const t = k.dataset.tun;
    if (t === "bearbeiten") { G.bearbeiten = true; planZeichnen(); panelZeichnen(); leisteAktualisieren(); }
    if (t === "fixieren") festSetzen(o.id, true);
    if (t === "loesen") { festSetzen(o.id, false); if (!G.bearbeiten) { G.bearbeiten = true; planZeichnen(); panelZeichnen(); leisteAktualisieren(); } }
    if (t === "loeschen") loeschen(o.id);
    if (t === "duplizieren") duplizieren(o.id);
    if (t === "drehen90") drehen(o.id, 90);
    if (t === "ecke-weg") eckeEntfernen(o.id, G.ecke);
    if (t === "drehen") {
      const w = await eingabe({ titel: "Drehen", text: "Um wie viel Grad soll die Fläche im Uhrzeigersinn gedreht werden? Minus dreht andersherum.", felder: [{ id: "grad", label: "Winkel", typ: "number", wert: 15, schritt: 1, einheit: "°" }], ja: "Drehen" });
      if (w && w.grad) drehen(o.id, w.grad);
    }
  });
}

function uebersichtHTML() {
  const ob = D.garten.objekte;
  if (!ob.length) return `<div class="karte"><h2>So fängst du an</h2>
    <ol class="klein" style="padding-left:18px;margin:0 0 10px">
      <li>Gartenfläche als Rechteck mit ungefähren Maßen anlegen.</li>
      <li>Ecken ziehen, bis die Form passt. Mit dem Plus auf einer Kante entstehen neue Ecken, zum Beispiel für ein L.</li>
      <li>Gartenfläche fixieren, dann Haus, Wege und Beete hinzufügen.</li>
    </ol>
    <button class="knopf haupt" data-tun="anlegen">Gartenfläche anlegen</button></div>`;
  const nachArt = ART_REIHENFOLGE.map(k => ob.filter(o => o.art === k)).filter(l => l.length).flat();
  return `<div class="karte"><h2>Im Plan</h2><ul class="objliste">
      ${nachArt.map(o => `<li data-waehle="${o.id}">${farbpunkt(o.art)}<span>${esc(o.name)}${o.fest ? " 🔒" : ""}</span><span class="leise">${o.form === "linie" ? m(laengeLinie(umriss(o))) : zahl(flaeche(o) / 10000, 1) + " m²"}</span></li>`).join("")}
    </ul></div>
    <div class="karte"><h2>Bereiche</h2>
      ${D.garten.bereiche.length ? `<ul class="objliste">${D.garten.bereiche.map(b => `<li data-bereich="${b.id}"><span>📍 ${esc(b.name)}</span><button class="x" data-bereich-weg="${b.id}" aria-label="Bereich löschen" title="Löschen">✕</button></li>`).join("")}</ul>`
        : `<p class="klein leise">Noch keine. Zoome auf einen Teil des Gartens und tippe auf „📍 Merken“, um direkt dorthin springen zu können.</p>`}
    </div>
    <div class="karte"><h2>Raster</h2>
      <p class="klein leise">Ecken und Flächen rasten in diesem Abstand ein.</p>
      <div class="umschalter" id="raster">${[1, 5, 10, 50].map(r => `<button data-r="${r}" class="${(D.garten.raster || 10) === r ? "an" : ""}">${r} cm</button>`).join("")}</div>
    </div>`;
}
function uebersichtEreignisse(el) {
  const a = $('[data-tun="anlegen"]', el); if (a) a.onclick = gartenflaecheAnlegen;
  $$("[data-waehle]", el).forEach(li => li.onclick = () => {
    const o = objekt(li.dataset.waehle); waehlen(o.id);
    const r = rahmen(o); zeigeBereich(r.x1, r.y1, r.x2 - r.x1, r.y2 - r.y1);
  });
  $$("[data-bereich]", el).forEach(li => li.onclick = e => {
    if (e.target.closest("[data-bereich-weg]")) return;
    const b = D.garten.bereiche.find(x => x.id === li.dataset.bereich); zeigeBereich(b.x, b.y, b.w, b.h);
  });
  $$("[data-bereich-weg]", el).forEach(k => k.onclick = () => {
    const vorher = stand(); D.garten.bereiche = D.garten.bereiche.filter(b => b.id !== k.dataset.bereichWeg);
    merken(vorher); panelZeichnen(); leisteAktualisieren();
  });
  $$("#raster button", el).forEach(k => k.onclick = () => { D.garten.raster = +k.dataset.r; speichern(); panelZeichnen(); });
}

/* ---------- Seite „Garten“ ---------- */
function gartenSeite(main) {
  seitentitel(main, "Garten");
  if (G.bearbeiten === null) G.bearbeiten = D.garten.objekte.length === 0 || matchMedia("(min-width:900px)").matches;
  main.insertAdjacentHTML("beforeend", `
    <div class="plan-leiste">
      <button class="knopf" id="k-bearbeiten"></button>
      <details class="menue" id="k-hinzu"><summary class="knopf haupt" title="Hinzufügen">＋<span class="lang"> Hinzufügen</span></summary>
        <div class="menue-liste">${ART_REIHENFOLGE.map(k => `<button data-art="${k}">${farbpunkt(k)}<span>${ARTEN[k].name}${ARTEN[k].hinweis ? `<br><span class="klein leise">${ARTEN[k].hinweis}</span>` : ""}</span></button>`).join("")}</div>
      </details>
      <button class="knopf" id="k-zurueck" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
      <button class="knopf" id="k-vor" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
      <span class="trenner"></span>
      <button class="knopf" id="k-minus" aria-label="Verkleinern" title="Verkleinern">−</button>
      <button class="knopf" id="k-plus" aria-label="Vergrößern" title="Vergrößern">+</button>
      <button class="knopf" id="k-alles" title="Ganzen Garten zeigen" aria-label="Ganzen Garten zeigen">⤢<span class="lang"> Alles</span></button>
      <select id="k-bereich" aria-label="Springe zu Bereich"></select>
      <button class="knopf" id="k-merken" title="Aktuelle Ansicht als Bereich merken" aria-label="Ansicht merken">📍<span class="lang"> Merken</span></button>
    </div>
    <div class="garten-layout">
      <div class="plan-rahmen">
        <svg id="plan" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="img" aria-label="Gartenplan"></svg>
        <div class="massstab" id="massstab"></div>
      </div>
      <div class="panel" id="garten-panel"></div>
    </div>
    <div class="karte bald" style="margin-top:14px"><h2>🌱 Als Nächstes</h2>
      <p class="leise klein" style="margin:0">Pflanzen per Klick in die Beete setzen, ernten und abräumen – sobald das Pflanzenlexikon da ist.</p></div>`);

  planEreignisse();
  $("#k-bearbeiten").onclick = () => { G.bearbeiten = !G.bearbeiten; G.ecke = null; planZeichnen(); panelZeichnen(); leisteAktualisieren(); };
  $("#k-zurueck").onclick = rueckgaengig;
  $("#k-vor").onclick = wiederholen;
  $("#k-plus").onclick = () => zoomen(1 / 1.4);
  $("#k-minus").onclick = () => zoomen(1.4);
  $("#k-alles").onclick = allesZeigen;
  $("#k-merken").onclick = bereichMerken;
  $("#k-bereich").onchange = e => {
    const v = e.target.value; e.target.value = "";
    if (v === "alles") allesZeigen();
    else { const b = D.garten.bereiche.find(x => x.id === v); if (b) zeigeBereich(b.x, b.y, b.w, b.h); }
  };
  $$("#k-hinzu [data-art]").forEach(b => b.onclick = () => {
    $("#k-hinzu").open = false;
    if (b.dataset.art === "garten" && !D.garten.objekte.some(o => o.art === "garten")) gartenflaecheAnlegen();
    else hinzufuegen(b.dataset.art);
  });

  leisteAktualisieren();
  requestAnimationFrame(() => {
    if (!G.view) allesZeigen(); else planZeichnen();
    panelZeichnen();
  });
}
let gartenGroesseTimer;
window.addEventListener("resize", () => {
  clearTimeout(gartenGroesseTimer);
  gartenGroesseTimer = setTimeout(() => { if (aktuelleSeite() === "garten") planZeichnen(); }, 100);
});
document.addEventListener("click", e => { const mn = $("#k-hinzu"); if (mn && mn.open && !mn.contains(e.target)) mn.open = false; });


/* ============================================================
   SICHERUNG
   ============================================================ */
function sicherungHerunterladen() {
  const inhalt = JSON.stringify({ app: "kraut-und-rueben", version: APP_VERSION, gesichert: new Date().toISOString(), daten: D }, null, 2);
  const blob = new Blob([inhalt], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `kraut-und-rueben-sicherung-${heuteISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  melden("Sicherung heruntergeladen.");
}

async function sicherungLaden(datei) {
  if (!datei) return;
  try {
    const j = JSON.parse(await datei.text());
    const daten = j.app === "kraut-und-rueben" ? j.daten : null;
    if (!daten || typeof daten !== "object" || !daten.schema) throw new Error("Das ist keine Sicherung von Kraut und Rüben.");
    const ok = await fragen({ titel: "Sicherung laden?", text: `Sicherung vom ${zeitText(j.gesichert)}. Deine aktuellen Daten auf diesem Gerät werden dadurch ersetzt.`, ja: "Laden" });
    if (!ok) return;
    D = ergaenzen(daten);
    D.einstellungen.willkommenGesehen = true;
    speichern();
    designAnwenden();
    zeigen();
    melden("Sicherung geladen.");
  } catch (e) {
    fragen({ titel: "Laden nicht möglich", text: esc(e.message), ja: "OK", nein: null });
  } finally {
    const f = $("#datei"); if (f) f.value = "";
  }
}

/* ============================================================
   WILLKOMMEN (nur beim allerersten Öffnen)
   ============================================================ */
function willkommenPruefen() {
  if (D.einstellungen.willkommenGesehen) return;
  const w = $("#willkommen");
  w.classList.remove("verborgen");
  const fertig = () => {
    D.einstellungen.willkommenGesehen = true;
    speichern();
    w.classList.add("verborgen");
    zeigen();
  };
  ortsauswahl($("#willkommen-ort"), fertig);
  $("#willkommen-spaeter").onclick = fertig;
}

/* ============================================================
   OFFLINE-FÄHIGKEIT & UPDATES
   ============================================================ */
function serviceWorkerStarten() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const neu = reg.installing;
      neu && neu.addEventListener("statechange", () => {
        if (neu.state === "installed" && navigator.serviceWorker.controller) {
          melden("Eine neue Version ist da.", { text: "Aktualisieren", tun: () => neu.postMessage("jetzt-aktivieren") });
        }
      });
    });
  }).catch(e => console.warn("Service Worker:", e));
  // Nur neu laden, wenn eine ältere Version durch eine neue ersetzt wurde (nicht beim allerersten Besuch)
  const hatteVersion = !!navigator.serviceWorker.controller;
  let neuGeladen = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hatteVersion || neuGeladen) return; neuGeladen = true; location.reload();
  });
}

/* ============================================================
   START
   ============================================================ */
designAnwenden();
navAufbauen();
zeigen();
willkommenPruefen();
serviceWorkerStarten();
window.addEventListener("resize", (() => { let breit = matchMedia("(min-width:900px)").matches;
  return () => { const b = matchMedia("(min-width:900px)").matches; if (b !== breit) { breit = b; if (aktuelleSeite() === "start") zeigen(); } }; })());
</script>
